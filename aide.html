<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Aide &amp; guide — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-aide.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">

<div class="v2-shell">

  <!-- ── Barre du haut ── -->
  <header class="v2-top">
    <a class="v2-logo" href="accueil.html" title="Retour à l'accueil" aria-label="Retour à l'accueil">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </a>
    <div style="min-width:0">
      <div class="v2-eyebrow">Internalis</div>
      <div class="v2-top-title">Aide &amp; guide d'utilisation</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <input type="search" class="ai-top-search" id="aideRecherche" placeholder="Rechercher dans le guide…" aria-label="Rechercher dans le guide" oninput="aide2Filtrer(this.value)"/>
      <a class="v2-back" href="accueil.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Accueil
      </a>
    </div>
  </header>

  <!-- ── Contenu ── -->
  <main class="v2-body">

    <div class="ai-hero">
      <span class="ai-hero-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </span>
      <div style="min-width:0">
        <div class="ai-hero-t">Guide d'utilisation</div>
        <div class="ai-hero-s">Survolez les pastilles numérotées sur chaque écran pour voir à quoi sert chaque zone. Une légende détaillée accompagne chaque écran.</div>
      </div>
      <div class="ai-hero-k">
        <div class="ai-kpi"><div class="ai-kpi-n" id="aideNbSec">—</div><div class="ai-kpi-l">Sections</div></div>
        <div class="ai-kpi"><div class="ai-kpi-n" id="aideRole">—</div><div class="ai-kpi-l">Votre accès</div></div>
      </div>
    </div>

    <div class="ai-layout">
      <!-- Sections du guide (rendues par js/aide-v2.js) -->
      <div class="ai-main" id="aideMain"></div>

      <!-- Rail : sommaire -->
      <aside class="ai-rail">
        <div class="dc-card">
          <div class="dc-head">
            <div class="dc-head-l">
              <span class="dc-chip" style="background:#6366f122;color:#6366f1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
              <div style="min-width:0"><div class="dc-eyebrow">Navigation</div><div class="dc-title">Sommaire</div></div>
            </div>
          </div>
          <div class="dc-body"><nav class="ai-toc" id="aideToc" aria-label="Sommaire du guide"></nav></div>
        </div>
      </aside>
    </div>

  </main>
</div>

<script src="js/app.js"></script>
<script>
  Auth.requireAuth();

  // Droits : les sections .admin-only et les conseils .superadmin-only ne
  // s'affichent qu'aux profils concernés. Le contrôle est identique à la V1,
  // il est simplement rejoué après le rendu du module V2.
  window.aideDroitAdmin = false;
  window.aideAppliquerDroits = function () {
    var admin = Auth.isAdmin();
    var sadmin = Auth.isSuperAdmin();
    window.aideDroitAdmin = !!admin;
    if (!admin) document.querySelectorAll('.admin-only').forEach(function (el) { el.classList.add('hidden'); });
    if (!sadmin) document.querySelectorAll('.superadmin-only').forEach(function (el) { el.classList.add('hidden'); });
    var r = document.getElementById('aideRole');
    if (r) r.textContent = sadmin ? 'Super admin' : (admin ? 'Admin' : 'Équipe');
  };
  window.aideAppliquerDroits();
</script>
<script src="js/aide-v2.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
