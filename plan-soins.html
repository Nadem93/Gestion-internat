<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Plan de soins — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-plan-soins.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="app-layout"><div class="main">
  <div class="v2-shell ps2-shell">

    <!-- BARRE DU HAUT -->
    <div class="v2-top">
      <a class="v2-logo" href="accueil.html" style="background:linear-gradient(135deg,#0891b2,#38bdf8)" aria-label="Accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M9 12h6m-3-3v6"/><circle cx="12" cy="12" r="10"/></svg>
      </a>
      <div style="line-height:1.15;min-width:0">
        <div class="v2-eyebrow">INTERNALIS · Vie quotidienne</div>
        <div class="v2-top-title">Plan de soins</div>
      </div>
      <div class="ps2-topact">
        <select id="psResident" aria-label="Filtrer par résident">
          <option value="">Tous les résidents</option>
        </select>
        <button type="button" class="ps2-new" onclick="openPsModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouveau soin
        </button>
      </div>
    </div>

    <div class="v2-body">

      <!-- STATISTIQUES -->
      <div class="ps2-stats">
        <div class="ps2-stat" style="--pc:#0891b2">
          <span class="ps2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/></svg></span>
          <div><div class="ps2-stat-n" id="psStatTotal">—</div><div class="ps2-stat-l">Soins définis</div></div>
        </div>
        <div class="ps2-stat" style="--pc:#10b981">
          <span class="ps2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
          <div><div class="ps2-stat-n" id="psStatActifs">—</div><div class="ps2-stat-l">Actifs</div></div>
        </div>
        <div class="ps2-stat" style="--pc:#8b5cf6">
          <span class="ps2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
          <div><div class="ps2-stat-n" id="psStatResidents">—</div><div class="ps2-stat-l">Résidents suivis</div></div>
        </div>
        <div class="ps2-stat" style="--pc:#f59e0b">
          <span class="ps2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-3-3v6"/><circle cx="12" cy="12" r="10"/></svg></span>
          <div><div class="ps2-stat-n" id="psStatCats">—</div><div class="ps2-stat-l">Catégories</div></div>
        </div>
      </div>

      <!-- FILTRES (puces) — le <select> reste le contrat avec js/plan-soins.js -->
      <div class="v2-chips" id="psChips" style="margin-bottom:14px"></div>
      <select id="psFilterCat" aria-hidden="true" tabindex="-1">
        <option value="">Toutes les catégories</option>
        <option value="hygiene">Hygiène corporelle</option>
        <option value="medication">Médicaments</option>
        <option value="mobilite">Mobilité &amp; posture</option>
        <option value="alimentation">Alimentation &amp; repas</option>
        <option value="soins_infirm">Soins infirmiers</option>
        <option value="psy">Accompagnement psy</option>
        <option value="social">Accompagnement social</option>
        <option value="autre">Autre</option>
      </select>

      <!-- Checklist du jour / navigation historique -->
      <div id="psDateBar" class="ps2-datebar"></div>

      <!-- GRILLE DES SOINS -->
      <div id="psList" class="ps2-grid"></div>

      <!-- OBJECTIFS + RÉÉVALUATIONS -->
      <div id="psBottom" class="ps2-bottom"></div>

    </div>
  </div>
</div></div>

<!-- MODALE NOUVEAU / MODIFIER SOIN -->
<div class="modal-overlay v2-ov" id="modalPlanSoins">
  <div class="v2-md" style="--mc:#0891b2">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-3-3v6"/><circle cx="12" cy="12" r="10"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t" id="psModalTitle">Nouveau soin</div>
        <div class="v2-md-s">Résident, catégorie, fréquence et modalités</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalPlanSoins')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <input type="hidden" id="psModalId"/>

    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l" for="psModalResident">Résident concerné</label>
        <select id="psModalResident" class="v2-fld">
          <option value="">— Choisir un résident —</option>
        </select>
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="psModalCat">Catégorie *</label>
          <select id="psModalCat" class="v2-fld">
            <option value="hygiene">🚿 Hygiène corporelle</option>
            <option value="medication">💊 Médicaments</option>
            <option value="mobilite">🦽 Mobilité &amp; posture</option>
            <option value="alimentation">🍽️ Alimentation &amp; repas</option>
            <option value="soins_infirm">🩺 Soins infirmiers</option>
            <option value="psy">🧠 Accompagnement psy</option>
            <option value="social">🤝 Accompagnement social</option>
            <option value="autre">📋 Autre</option>
          </select>
        </div>
        <div>
          <label class="v2-fld-l" for="psModalFreq">Fréquence *</label>
          <select id="psModalFreq" class="v2-fld">
            <option value="quotidien">Quotidien</option>
            <option value="matin">Matin</option>
            <option value="midi">Midi</option>
            <option value="soir">Soir</option>
            <option value="nuit">Nuit</option>
            <option value="semaine">Hebdomadaire</option>
            <option value="mensuel">Mensuel</option>
            <option value="si_besoin">Si besoin</option>
          </select>
        </div>
      </div>

      <div>
        <label class="v2-fld-l" for="psModalLibelle">Libellé du soin *</label>
        <input type="text" id="psModalLibelle" class="v2-fld" placeholder="Ex : Aide à la douche complète, Vérification glycémie…"/>
      </div>

      <div>
        <label class="v2-fld-l" for="psModalDetail">Détail / modalités</label>
        <input type="text" id="psModalDetail" class="v2-fld" placeholder="Ex : avec chaise de douche, côté droit, 15 min environ"/>
      </div>

      <div>
        <label class="v2-fld-l" for="psModalIntervenant">Intervenant(s)</label>
        <input type="text" id="psModalIntervenant" class="v2-fld" placeholder="Ex : AS, IDE, Éducateur spécialisé…"/>
      </div>

      <div>
        <label class="v2-fld-l" for="psModalNote">Note / observation</label>
        <textarea id="psModalNote" class="v2-fld" rows="2" placeholder="Informations complémentaires, précautions…"></textarea>
      </div>
    </div>

    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalPlanSoins')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="savePlanSoins()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/config-supabase.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/plan-soins-supabase.js"></script>
<script src="js/plan-soins.js"></script>
<script src="js/plan-soins-v2.js"></script>
</body>
</html>
