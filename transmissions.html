<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>

  <link rel="stylesheet" href="css/style.css"/>

  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── Kanban Board ── */
.kb-header-bar{display:flex;align-items:center;gap:.65rem;background:#fff;border:1px solid var(--border);border-radius:12px;padding:.55rem .9rem;margin-bottom:.75rem}
.kb-date-nav{display:flex;align-items:center;gap:.25rem;background:var(--g50);border:1px solid var(--border);border-radius:8px;padding:3px 6px}
.kb-date-nav button{background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:0 3px;line-height:1;transition:color .1s}
.kb-date-nav button:hover{color:var(--text)}
.kb-date-label{font-size:.82rem;font-weight:700;color:var(--text);text-transform:capitalize;min-width:120px;text-align:center}

.kb-filters{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:.5rem .9rem;margin-bottom:.75rem}
.kb-filters select{font-size:.78rem;padding:.3rem .55rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
.kb-stat-pill{display:flex;align-items:center;gap:.55rem;margin-left:auto;font-size:.75rem}
.kb-stat-pill .sp{display:flex;align-items:center;gap:.3rem}
.kb-stat-pill .sp-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kb-stat-pill .spl{width:1px;height:14px;background:var(--border)}

/* Board grid */
.kb-board{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}
.kb-col{background:var(--g50,#f8fafc);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.kb-col-hdr{padding:.9rem 1rem .65rem;border-bottom:1px solid var(--border);background:#fff}
.kb-col-hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.45rem}
.kb-col-name{font-size:.88rem;font-weight:600;color:var(--text);display:flex;align-items:center;gap:.4rem}
.kb-col-hours{font-size:.7rem;color:var(--muted);font-weight:400}
.kb-col-count{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px}

/* Cards container */
.kb-cards{padding:.65rem;display:flex;flex-direction:column;gap:.55rem}

/* Card */
.kb-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:.85rem 1rem;transition:box-shadow .12s,border-color .12s}
.kb-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08);border-color:var(--primary)}
.kb-card.kb-unread{border-left:3px solid #ef4444}
.kb-card.kb-urgent{border-left:3px solid #dc2626;background:#fffbfb}
.kb-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.55rem;gap:.4rem}
.kb-resident{display:flex;align-items:center;gap:.5rem}
.kb-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;text-transform:uppercase}
.kb-avatar-img{object-fit:cover;border:2px solid var(--border)}
.kb-card-name{font-size:.84rem;font-weight:600;color:var(--text);line-height:1.2}
.kb-card-room{font-size:.7rem;color:var(--muted);margin-top:2px}
.kb-time-wrap{display:flex;align-items:center;gap:.35rem;flex-shrink:0}
.kb-unread-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0}
.kb-card-time{font-size:.72rem;color:var(--muted)}
.kb-card-body{font-size:.82rem;color:var(--text);line-height:1.6;margin-bottom:.55rem;white-space:pre-wrap}
.kb-card-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.3rem}
.kb-badges{display:flex;gap:.3rem;flex-wrap:wrap}
.kb-badge{font-size:.69rem;font-weight:600;padding:3px 8px;border-radius:20px}
.kb-actions{display:flex;gap:.3rem}
.kb-actions button{font-size:.69rem;padding:3px 8px;border-radius:7px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);transition:background .1s,color .1s,border-color .1s}
.kb-actions button:hover{background:var(--g50);color:var(--text)}
.kb-actions .btn-read{color:var(--primary);border-color:var(--primary)}
.kb-actions .btn-del{color:#dc2626;border-color:#fecaca}
.kb-actions .btn-incident{color:#dc2626;border-color:#fecaca;background:#fff5f5}
.kb-actions .btn-incident.btn-on{color:#fff;border-color:#dc2626;background:#dc2626;font-weight:700}
.kb-actions .btn-journal{color:#059669;border-color:#a7f3d0;background:#f0fdf4}
.kb-actions .btn-journal.btn-on{color:#fff;border-color:#059669;background:#059669;font-weight:700}
.kb-card-author{font-size:.69rem;color:var(--muted);margin-top:.4rem}
.kb-add-btn{margin:.4rem .65rem .65rem;padding:.55rem;border:1.5px dashed var(--border);border-radius:9px;font-size:.78rem;color:var(--muted);text-align:center;cursor:pointer;background:none;width:calc(100% - 1.3rem);transition:background .1s,border-color .1s,color .1s}
.kb-add-btn:hover{background:#fff;border-color:var(--primary);color:var(--primary)}
.kb-empty-col{padding:2rem 1rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.45rem;opacity:.45}
.kb-empty-col .ei{font-size:1.7rem}
.kb-empty-col span{font-size:.78rem;color:var(--muted)}
.kb-sep{height:1px;background:var(--border);margin:0 .25rem}
.kb-replies{margin-top:.55rem;padding-top:.55rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.kb-reply{background:var(--g50);border-radius:8px;padding:.4rem .6rem;font-size:.78rem;line-height:1.5}
.kb-reply-author{font-weight:700;color:var(--text)}
.kb-reply-time{font-size:.66rem;color:var(--muted);margin-left:.4rem}
.kb-reply-form{display:flex;gap:.4rem;margin-top:.45rem}
.kb-reply-form textarea{flex:1;font-size:.78rem;padding:.4rem .6rem;border:1px solid var(--border);border-radius:8px;resize:vertical;min-height:2.3rem;font-family:inherit}
.kb-reply-form button{font-size:.74rem;padding:0 .8rem;border-radius:8px;border:none;background:var(--primary);color:#fff;cursor:pointer;flex-shrink:0}
.kb-reply-toggle{color:var(--primary)!important;border-color:var(--primary)!important}

@media(max-width:900px){.kb-board{grid-template-columns:1fr 1fr}.kb-stat-pill{display:none}}
@media(max-width:520px){.kb-board{grid-template-columns:1fr}}

/* ═══ Design « Timeline lumineuse » (cartes de quart) ═══ */
@keyframes trGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.kb-col{background:#fff !important;position:relative;box-shadow:0 4px 16px rgba(30,41,59,.06)}
/* Barre néon latérale colorée par quart */
.kb-col::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2;
  background:linear-gradient(180deg,var(--sc,#6366f1),color-mix(in srgb,var(--sc,#6366f1) 55%,#fff));
  box-shadow:0 0 14px var(--sc,#6366f1)}
.kb-col-hdr{padding-left:1.25rem}
/* Points de progression pulsants */
.kb-col-dots{display:flex;align-items:center;gap:6px;margin-top:.55rem}
.kb-dot{width:9px;height:9px;border-radius:50%;background:#dbe3ee;flex-shrink:0}
.kb-dot.lit{background:var(--sc,#6366f1);box-shadow:0 0 6px color-mix(in srgb,var(--sc,#6366f1) 60%,transparent)}
.kb-dot.on{background:var(--sc,#6366f1);box-shadow:0 0 8px var(--sc,#6366f1);animation:trGlow 2s ease-in-out infinite}
.kb-line{flex:1;height:2px;background:#e8edf6;border-radius:2px}
.kb-line.lit{background:var(--sc,#6366f1);opacity:.55}
@media(prefers-reduced-motion:reduce){.kb-dot.on{animation:none}}
</style>
</head>
<body class="v2">
<div class="app-layout"><div class="main">
  <!-- Pleine largeur : le tableau à trois vacations respire mal dans les 1400 px
       du canevas des maquettes. -->
  <div class="v2-shell">

    <div class="v2-top">
      <a class="v2-logo" href="accueil.html">I</a>
      <div style="line-height:1.15;min-width:0">
        <div class="v2-eyebrow">INTERNALIS · Passation d'équipe</div>
        <div class="v2-top-title">Transmissions</div>
      </div>
      <div class="v2-datenav" style="margin-left:8px">
        <button type="button" onclick="trPrevDay()" title="Jour précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span class="v2-datenav-l" id="trDateLabel" onclick="trGoToday()" title="Revenir à aujourd'hui"></span>
        <button type="button" onclick="trNextDay()" title="Jour suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <button class="btn btn-accent btn-sm" onclick="tv2Nouvelle()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:15px;height:15px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle transmission
        </button>
      </div>
    </div>

    <div class="v2-body">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px">
        <div class="v2-chips" id="trFilters"></div>
        <div class="v2-stats" id="trStats"></div>
      </div>

      <div id="trList" class="v2-board"></div>

      <div class="v2-tr-bottom" style="margin-top:18px">
        <div class="v2-blk" id="trSynthese"></div>
        <div class="v2-consignes" id="trConsignes"></div>
      </div>

      <div class="v2-blk" id="trHisto" style="margin-top:18px"></div>
    </div>

  </div>
</div></div>

<!-- MODAL NOUVELLE TRANSMISSION — Template 2 panneau latéral -->
<div class="modal-overlay v2-ov" id="modalTr">
  <div class="v2-md" style="--mc:#22d3ee">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t" id="modalTrTitle">Nouvelle transmission</div>
        <div class="v2-md-s">Catégorie, résident et observation</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalTr')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <input type="hidden" id="trEditId"/>
    <input type="hidden" id="trShift" value="matin"/>

    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l" for="trCat">Catégorie *</label>
        <select id="trCat" class="v2-fld">
          <option value="sante">🏥 Santé</option>
          <option value="medicament">💊 Médicament</option>
          <option value="comportement">🧠 Comportement</option>
          <option value="alimentation">🍽️ Alimentation</option>
          <option value="hygiene">🚿 Hygiène</option>
          <option value="activite">🎯 Activité</option>
          <option value="famille">👨‍👩‍👧 Famille</option>
          <option value="sortie">🚪 Sortie / Retour</option>
          <option value="administratif">📋 Administratif</option>
          <option value="maintenance">🔧 Maintenance</option>
          <option value="urgent">⚡ Urgent</option>
        </select>
      </div>

      <div>
        <label class="v2-fld-l" for="trResident">Résident concerné</label>
        <select id="trResident" class="v2-fld"></select>
      </div>

      <div>
        <label class="v2-fld-l">Priorité</label>
        <div class="v2-seg" id="trPrioritySeg">
          <button type="button" class="v2-seg-o" data-v="info" onclick="trSetPriority('info')">Information</button>
          <button type="button" class="v2-seg-o on" data-v="normal" onclick="trSetPriority('normal')">Normal</button>
          <button type="button" class="v2-seg-o" data-v="urgent" onclick="trSetPriority('urgent')">Urgent</button>
        </div>
        <input type="hidden" id="trPriority" value="normal"/>
      </div>

      <div>
        <label class="v2-fld-l" for="trContent">Observation *</label>
        <textarea id="trContent" class="v2-fld" rows="4" placeholder="Décrivez l'observation, l'événement ou la consigne à transmettre à l'équipe suivante…"></textarea>
      </div>

      <div>
        <label class="v2-fld-l" for="trSoutien">Accompagnement apporté <span style="color:var(--v2-t7);font-weight:400">— facultatif</span></label>
        <textarea id="trSoutien" class="v2-fld" rows="2" placeholder="Ex : incitation verbale pour la toilette, médiation avec un pair, présence rassurante…"></textarea>
        <select id="trSoutienNiveau" class="v2-fld" style="margin-top:12px">
          <option value="">Niveau de soutien — non précisé</option>
          <option value="autonomie">🟢 Autonomie — présence simple</option>
          <option value="supervision">🔵 Supervision / veille</option>
          <option value="verbal">🟡 Incitation / guidance verbale</option>
          <option value="partiel">🟠 Aide partielle</option>
          <option value="total">🔴 Aide totale</option>
        </select>
      </div>

      <div class="v2-note v2-note-ok" id="trRecap" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="trRecapTxt"></span>
      </div>
    </div>

    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalTr')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="saveTr_Modal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        Enregistrer la transmission
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay v2-ov" id="modalConsigne">
  <div class="v2-md" style="--mc:#f59e0b;max-width:560px">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t">Nouvelle consigne permanente</div>
        <div class="v2-md-s">Affichée en haut de la passation, tous les jours</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalConsigne')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l">Nature de la consigne</label>
        <div class="v2-seg" id="consCatSeg">
          <button type="button" class="v2-seg-o on" data-v="soin" onclick="tv2SetConsCat('soin')">Soin</button>
          <button type="button" class="v2-seg-o" data-v="securite" onclick="tv2SetConsCat('securite')">Sécurité</button>
          <button type="button" class="v2-seg-o" data-v="direction" onclick="tv2SetConsCat('direction')">Direction</button>
          <button type="button" class="v2-seg-o" data-v="autre" onclick="tv2SetConsCat('autre')">Autre</button>
        </div>
        <input type="hidden" id="consCat" value="soin"/>
      </div>
      <div>
        <label class="v2-fld-l" for="consTexte">Consigne *</label>
        <textarea id="consTexte" class="v2-fld" rows="3" placeholder="Ex : M. Diallo — traitement cardiaque à 08h impérativement, ne pas décaler."></textarea>
      </div>
      <div>
        <label class="v2-fld-l" for="consAuteur">Émetteur</label>
        <input type="text" id="consAuteur" class="v2-fld" placeholder="Ex : Consigne infirmerie, Direction, Sécurité…"/>
      </div>
      <div class="v2-note v2-note-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Une consigne permanente reste affichée jusqu'à ce qu'un administrateur la retire.</span>
      </div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalConsigne')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="tv2SaveConsigne()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        Publier la consigne
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>

<script src="js/journal-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/transmissions-supabase.js"></script>
<script src="js/consignes-supabase.js"></script>
<script src="js/transmissions.js"></script>
<script src="js/transmissions-v2.js"></script>
</body>
