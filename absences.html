<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Absences &amp; AT — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-absences.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(239,68,68,.16)">

  <!-- ── BARRE HAUTE ────────────────────────────────────────────────── -->
  <div class="v2-top">
    <a class="v2-logo" href="rh.html" style="background:linear-gradient(135deg,#dc2626,#f87171);color:#fff" title="Retour au portail RH">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · RH</div>
      <div class="v2-top-title">Absences &amp; accidents du travail</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button id="btnAddAbsence" type="button" class="v2-btn v2-btn-primary" onclick="openAbsenceModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Déclarer une absence
      </button>
      <a href="rh.html" class="v2-btn">Portail</a>
    </div>
  </div>

  <div class="v2-body">

    <!-- KPI -->
    <div id="abStats" class="v2-kgrid abv-stats"></div>

    <!-- Alertes réglementaires (CPAM 48 h, visites de reprise) -->
    <div id="abAlerts" class="abv-alerts"></div>

    <!-- Filtres -->
    <div class="abv-filters">
      <div id="abChips" class="v2-chips"></div>
      <select id="abFilterEmploye" class="abv-sel" aria-label="Filtrer par employé">
        <option value="">Tous les employés</option>
      </select>
      <select id="abFilterType" class="abv-hidden" tabindex="-1" aria-hidden="true">
        <option value="">Tous les types</option>
        <option value="maladie">Arrêt maladie</option>
        <option value="at">Accident du travail</option>
        <option value="maladie_pro">Maladie professionnelle</option>
        <option value="maternite">Congé maternité/paternité</option>
        <option value="longue_maladie">Longue maladie</option>
        <option value="autre">Autre absence</option>
      </select>
    </div>

    <!-- Corps : tableau + registre AT · rail analytique -->
    <div class="abv-grid">
      <div class="abv-main">
        <div id="abList"></div>
        <div id="abRegistre"></div>
      </div>
      <aside class="abv-rail">
        <div id="abTaux"></div>
        <div id="abMotifs"></div>
        <div id="abRetours"></div>
      </aside>
    </div>

    <!-- Déclaration AT + visites médicales -->
    <div class="abv-feat2">
      <div id="abDeclAT"></div>
      <div id="abVisites"></div>
    </div>

    <!-- Impact planning + coût + Bradford -->
    <div class="abv-feat3">
      <div id="abImpact"></div>
      <div id="abCout"></div>
      <div id="abBradford"></div>
    </div>

  </div>
</div>

<!-- ══ MODALE — gabarit V2 de référence ══════════════════════════════ -->
<div class="v2-ov" id="modalAbsence">
  <div class="v2-md" style="--mc:#f59e0b;max-width:600px">
    <div class="v2-md-h">
      <span class="v2-md-ico" id="abModalIco">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t" id="abModalTitle">Déclarer une absence</div>
        <div class="v2-md-s" id="abModalSub">Motif, période et justificatif</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalAbsence')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l" for="abEmploye">Salarié</label>
        <select id="abEmploye" class="v2-fld"></select>
      </div>

      <div>
        <label class="v2-fld-l">Motif</label>
        <div class="v2-seg abv-seg" id="abSeg">
          <button type="button" class="v2-seg-o on" data-t="maladie"        onclick="ABV.pickType('maladie')">Maladie</button>
          <button type="button" class="v2-seg-o"    data-t="at"             onclick="ABV.pickType('at')">Accident travail</button>
          <button type="button" class="v2-seg-o"    data-t="maladie_pro"    onclick="ABV.pickType('maladie_pro')">Maladie pro</button>
          <button type="button" class="v2-seg-o"    data-t="maternite"      onclick="ABV.pickType('maternite')">Maternité</button>
          <button type="button" class="v2-seg-o"    data-t="longue_maladie" onclick="ABV.pickType('longue_maladie')">Longue maladie</button>
          <button type="button" class="v2-seg-o"    data-t="autre"          onclick="ABV.pickType('autre')">Autre</button>
        </div>
        <select id="abType" class="abv-hidden" tabindex="-1" aria-hidden="true">
          <option value="maladie">Arrêt maladie</option>
          <option value="at">Accident du travail</option>
          <option value="maladie_pro">Maladie professionnelle</option>
          <option value="maternite">Congé maternité/paternité</option>
          <option value="longue_maladie">Longue maladie</option>
          <option value="autre">Autre absence</option>
        </select>
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="abDebut">Du</label>
          <input type="date" id="abDebut" class="v2-fld"/>
        </div>
        <div>
          <label class="v2-fld-l" for="abFin">Au <span class="abv-opt">(si connue)</span></label>
          <input type="date" id="abFin" class="v2-fld"/>
        </div>
      </div>

      <div id="abDuree" class="v2-note v2-note-warn"></div>

      <label class="abv-chk" for="abProlongation">
        <input type="checkbox" id="abProlongation"/>
        <span>Prolongation d'un arrêt précédent</span>
      </label>

      <div id="abDeclareeWrap" style="display:none">
        <label class="abv-chk abv-chk-danger" for="abDeclareeCpam">
          <input type="checkbox" id="abDeclareeCpam"/>
          <span>Accident déclaré à la CPAM <b>(obligation sous 48 h)</b></span>
        </label>
      </div>

      <div id="abVisiteWrap" style="display:none">
        <label class="v2-fld-l" for="abVisiteDate">Visite médicale de reprise</label>
        <div class="abv-visite">
          <input type="date" id="abVisiteDate" class="v2-fld"/>
          <label class="abv-chk" for="abVisiteFaite">
            <input type="checkbox" id="abVisiteFaite"/>
            <span>Effectuée</span>
          </label>
        </div>
      </div>

      <div>
        <label class="v2-fld-l" for="abNotes">Notes / circonstances</label>
        <textarea id="abNotes" class="v2-fld" rows="3" placeholder="Détails, contexte de l'accident…"></textarea>
      </div>

      <div>
        <label class="v2-fld-l">Justificatif</label>
        <label class="abv-up" for="abFichier">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="abv-up-t" id="abFileName">Joindre l'arrêt de travail ou le certificat (PDF, JPG)</span>
          <span class="abv-up-a">Parcourir</span>
          <input type="file" id="abFichier" accept="image/*,application/pdf"/>
        </label>
        <div id="abJustifInfo" class="abv-just-info"></div>
      </div>
    </div>

    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec abv-del" id="abDeleteBtn" onclick="deleteAbsence()">Supprimer</button>
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalAbsence')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="saveAbsence()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        Enregistrer l'absence
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/absences.js"></script>
<script src="js/absences-v2.js?v=1"></script>
</body>
</html>
