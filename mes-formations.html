<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#0a1728"/>
  <title>Mes formations — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-mes-formations.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(22,163,74,.16)">

  <div class="v2-top">
    <a class="v2-logo" href="pilotage.html" style="background:linear-gradient(135deg,#16a34a,#4ade80)" title="Retour au portail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Espace personnel</div>
      <div class="v2-top-title">Mes formations</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <a href="pilotage.html" class="v2-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Portail
      </a>
    </div>
  </div>

  <div class="v2-body">

    <!-- Message : fiche salarié non reliée / erreur de chargement -->
    <div id="mfInfo"></div>

    <!-- Le reste n'apparaît qu'une fois la fiche salarié trouvée -->
    <div id="mfLayout" style="display:none">

      <!-- Tuiles statistiques -->
      <div id="mfStats" class="mf2-stats"></div>

      <!-- Filtres : chips à pastille. Le <select> hérité reste le contrat du JS. -->
      <div class="mf2-filters">
        <div id="mfChips" class="v2-chips"></div>
        <select id="mfFiltre" hidden aria-hidden="true" tabindex="-1" onchange="renderMesFormations()">
          <option value="dispo">Formations à venir</option>
          <option value="inscrit">Mes inscriptions</option>
          <option value="passe">Passées / suivies</option>
          <option value="tout">Toutes</option>
        </select>
      </div>

      <div class="mf2-body">
        <div class="mf2-main">
          <div class="mf2-card"><div id="mfList"></div></div>
        </div>

        <aside class="mf2-rail">
          <div id="mfParcours" class="mf2-parcours"></div>
          <div id="mfDomaines" class="v2-blk v2-rail-blk"></div>
          <div id="mfSessions" class="v2-blk v2-rail-blk"></div>
          <div id="mfEvaluations" class="v2-blk v2-rail-blk"></div>
        </aside>
      </div>

    </div>
  </div>
</div>

<!-- MODALE — ÉVALUER UNE FORMATION SUIVIE -->
<div class="v2-ov" id="modalMfEval">
  <div class="v2-md" style="--mc:#fbbf24">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
      <div style="min-width:0">
        <div class="v2-md-t" id="mfEvalTitre">Évaluer cette formation</div>
        <div class="v2-md-s" id="mfEvalSous"></div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalMfEval')" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l">Note globale</label>
        <div class="v2-seg" id="mfEvalSeg">
          <button type="button" class="v2-seg-o" data-n="1" onclick="mf2SetNote(1)">1</button>
          <button type="button" class="v2-seg-o" data-n="2" onclick="mf2SetNote(2)">2</button>
          <button type="button" class="v2-seg-o" data-n="3" onclick="mf2SetNote(3)">3</button>
          <button type="button" class="v2-seg-o" data-n="4" onclick="mf2SetNote(4)">4</button>
          <button type="button" class="v2-seg-o" data-n="5" onclick="mf2SetNote(5)">5</button>
        </div>
      </div>
      <div>
        <label class="v2-fld-l" for="mfEvalChaud">À chaud — juste après la session</label>
        <textarea class="v2-fld" id="mfEvalChaud" placeholder="Contenu, animation, ce que vous en retenez…"></textarea>
      </div>
      <div>
        <label class="v2-fld-l" for="mfEvalFroid">À froid — quelques semaines plus tard</label>
        <textarea class="v2-fld" id="mfEvalFroid" placeholder="Ce que vous avez réellement mis en pratique auprès des résidents…"></textarea>
      </div>
      <div class="v2-note v2-note-warn" id="mfEvalWarn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Les évaluations ne sont pas encore activées : exécutez migration-mes-formations.sql dans Supabase.
      </div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalMfEval')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="mf2SaveEval()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/search-global.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/formations-supabase.js"></script>
<script>
const MF_STATUT_L = { planifiee: 'Planifiée', realisee: 'Réalisée', annulee: 'Annulée' };
const MF_STATUT_C = { planifiee: '#d97706', realisee: '#16a34a', annulee: '#9ca3af' };

let _mfFiche = null;
let _mfCache = [];
let _mfEmployesMap = new Map();

function mfEur(n) { return (n || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function mfToday() { return new Date().toISOString().slice(0, 10); }

async function initMesFormations() {
  const s = Auth.requireAuth();
  if (!s) return;
  const info = document.getElementById('mfInfo');
  try {
    const employes = await sbGetEmployes();
    _mfEmployesMap = new Map(employes.map(e => [e.id, `${e.prenom || ''} ${e.nom || ''}`.trim()]));
    _mfFiche = employes.find(e => String(e.profileId) === String(s.userId)) || null;
    if (!_mfFiche) {
      info.innerHTML = `<div class="card" style="padding:1.25rem;text-align:center;color:var(--muted)">Votre compte n'est pas encore relié à une fiche salarié.<br>Contactez votre administrateur pour pouvoir vous inscrire aux formations.</div>`;
      return;
    }
    _mfCache = await sbGetFormations();
    renderMesFormations();
  } catch (e) {
    console.error('[initMesFormations]', e);
    info.innerHTML = `<div class="card" style="padding:1.25rem;text-align:center;color:var(--red)">Erreur de chargement : ${escHtml(e?.message || e)}</div>`;
  }
}

// Rendu historique — remplacé par js/mes-formations-v2.js, conservé comme
// repli si le module V2 n'est pas chargé.
function renderMesFormations() {
  const el = document.getElementById('mfList');
  const filtre = document.getElementById('mfFiltre').value;
  const myId = _mfFiche.id;
  let list = [..._mfCache];

  if (filtre === 'inscrit') list = list.filter(f => (f.participants || []).includes(myId));
  else if (filtre === 'dispo') list = list.filter(f => f.statut === 'planifiee' && (f.dateFin || f.dateDebut) >= mfToday());
  else if (filtre === 'passe') list = list.filter(f => (f.participants || []).includes(myId) && (f.statut === 'realisee' || (f.dateFin || f.dateDebut) < mfToday()));

  if (filtre === 'passe') list.sort((a, b) => (b.dateFin || b.dateDebut || '').localeCompare(a.dateFin || a.dateDebut || ''));
  else list.sort((a, b) => (a.dateDebut || '').localeCompare(b.dateDebut || ''));

  el.innerHTML = list.map(f => `<div class="v2-row"><div class="v2-row-title">${escHtml(f.titre)}</div></div>`).join('');
}

async function mfInscrire(id) {
  const f = _mfCache.find(x => x.id === id);
  if (!f) return;
  const parts = f.participants || [];
  if (parts.includes(_mfFiche.id)) { toast('Vous êtes déjà inscrit', 'info'); return; }
  if (f.maxParticipants && parts.length >= f.maxParticipants) { toast('Formation complète', 'error'); return; }
  try {
    const saved = await sbSetFormationParticipants(id, [...parts, _mfFiche.id]);
    const idx = _mfCache.findIndex(x => x.id === id);
    if (idx >= 0) _mfCache[idx] = saved;
    toast('Inscription confirmée ✓', 'success');
    renderMesFormations();
  } catch (e) { toast('Erreur : ' + (e?.message || e), 'error'); console.error('[mfInscrire]', e); }
}

async function mfDesinscrire(id) {
  const f = _mfCache.find(x => x.id === id);
  if (!f) return;
  try {
    const saved = await sbSetFormationParticipants(id, (f.participants || []).filter(p => p !== _mfFiche.id));
    const idx = _mfCache.findIndex(x => x.id === id);
    if (idx >= 0) _mfCache[idx] = saved;
    toast('Désinscription effectuée', 'info');
    renderMesFormations();
  } catch (e) { toast('Erreur : ' + (e?.message || e), 'error'); console.error('[mfDesinscrire]', e); }
}

// Liaison tardive : js/mes-formations-v2.js remplace initMesFormations.
document.addEventListener('DOMContentLoaded', () => initMesFormations());
</script>
<script src="js/mes-formations-v2.js"></script>
</body>
</html>
