<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><link rel="apple-touch-icon" href="icon-192.png"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Documents — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-documents.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="app-layout"><div class="main">
  <div class="v2-shell dg2-shell">

    <!-- BARRE DU HAUT -->
    <div class="v2-top">
      <a class="v2-logo" href="dossiers.html" style="background:linear-gradient(135deg,#8b5cf6,#a78bfa)" aria-label="Dossiers &amp; suivi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </a>
      <div style="line-height:1.15;min-width:0">
        <div class="v2-eyebrow">INTERNALIS · Dossiers &amp; suivi</div>
        <div class="v2-top-title">Documents (GED)</div>
      </div>
      <div class="dg2-top-act">
        <label class="dg2-search" for="docSearchInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="docSearchInput" placeholder="Résident, document…" aria-label="Rechercher un document"/>
        </label>
        <button type="button" class="dg2-new" onclick="openDocModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Ajouter
        </button>
      </div>
    </div>

    <div class="v2-body">

      <!-- STATISTIQUES -->
      <div class="dg2-stats" id="docStats"></div>

      <!-- FILTRES PAR CATÉGORIE -->
      <div class="dg2-filters">
        <div class="v2-chips" id="docFilters"></div>
        <select id="docFilterType" style="display:none"><option value="">Tous les types</option><option value="resident">Résidents</option><option value="resource">Ressources</option></select>
        <select id="docFilterCategory" style="display:none"><option value="">Toutes catégories</option><option value="administratif">Administratif</option><option value="medical">Médical</option><option value="scolaire">Scolaire</option><option value="judiciaire">Judiciaire</option><option value="contrat">Contrat</option><option value="ressource">Ressource</option><option value="autre">Autre</option></select>
        <select id="docFilterResident" class="v2-fld dg2-res-sel" aria-label="Filtrer par résident"><option value="">Tous les résidents</option></select>
      </div>

      <!-- COMPTES FAMILLE LIÉS (visible quand un résident est sélectionné) -->
      <div id="famLiensPanel"></div>

      <!-- GRILLE DES DOCUMENTS -->
      <div id="documentList"></div>

      <!-- RÉCENTS + MODÈLES -->
      <div class="dg2-bottom">
        <div class="v2-blk">
          <div class="dg2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="v2-blk-t">Ajoutés récemment</span>
          </div>
          <div id="docRecents"></div>
        </div>
        <div class="v2-blk">
          <div class="dg2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span class="v2-blk-t">Modèles réutilisables</span>
          </div>
          <div id="docModeles"></div>
        </div>
      </div>

    </div>
  </div>
</div></div>

<!-- ══ MODALE : AJOUTER / MODIFIER UN DOCUMENT ══ -->
<div class="v2-ov" id="docModal">
  <div class="v2-md" style="--mc:#818cf8">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t" id="docModalTitle">Ajouter un document</div>
        <div class="v2-md-s">Résident, catégorie et fichier</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('docModal')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="v2-md-b">
      <input type="hidden" id="docFormId"/>
      <div>
        <span class="v2-fld-l">Type de document</span>
        <div class="dg2-seg">
          <label class="dg2-seg-o"><input type="radio" name="docType" value="resident" checked onchange="toggleDocType('resident')"/>Résident</label>
          <label class="dg2-seg-o"><input type="radio" name="docType" value="resource" onchange="toggleDocType('resource')"/>Ressource</label>
        </div>
      </div>
      <div id="docFormResidentGroup">
        <label class="v2-fld-l" for="docFormResident">Résident</label>
        <select id="docFormResident" class="v2-fld"></select>
      </div>
      <div>
        <label class="v2-fld-l" for="docFormName">Nom du document</label>
        <input type="text" id="docFormName" class="v2-fld" placeholder="ex : Contrat de séjour"/>
      </div>
      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="docFormDate">Date du document</label>
          <input type="date" id="docFormDate" class="v2-fld"/>
        </div>
        <div>
          <label class="v2-fld-l" for="docFormDueDate">Date d'échéance</label>
          <input type="date" id="docFormDueDate" class="v2-fld"/>
        </div>
      </div>
      <div>
        <span class="v2-fld-l">Catégorie</span>
        <div class="dg2-cats" id="docCatChips"></div>
        <select id="docFormCategory" style="display:none"><option value="">—</option><option value="administratif">Administratif</option><option value="medical">Médical</option><option value="scolaire">Scolaire</option><option value="judiciaire">Judiciaire</option><option value="contrat">Contrat</option><option value="autre">Autre</option></select>
      </div>
      <div>
        <span class="v2-fld-l">Fichier</span>
        <div class="dg2-drop" id="docDropZone" onclick="document.getElementById('docFileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div style="flex:1;min-width:0">
            <div class="dg2-drop-t">Glisser un fichier ici</div>
            <div class="dg2-drop-s">PDF, Word, JPG, PNG · 3 Mo max</div>
          </div>
          <span class="dg2-drop-b">Parcourir</span>
        </div>
        <input type="file" id="docFileInput" style="display:none" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp" onchange="handleDocFileSelect(event)"/>
        <div id="docFilePending" class="dg2-pending" style="display:none;margin-top:9px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <div style="flex:1;min-width:0">
            <div id="docFilePendingName" class="dg2-pending-n"></div>
            <div id="docFilePendingSize" class="dg2-pending-s"></div>
          </div>
          <button type="button" class="dg2-pending-x" onclick="cancelDocFile()" aria-label="Retirer le fichier">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:14px;height:14px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('docModal')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="saveDocument()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        Téléverser
      </button>
    </div>
  </div>
</div>

<!-- ══ MODALE : COMPTE FAMILLE ══ -->
<div class="v2-ov" id="famModal">
  <div class="v2-md" style="--mc:#22d3ee">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t">Compte famille</div>
        <div class="v2-md-s">Accès en lecture aux documents partagés</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('famModal')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="v2-md-b">
      <div class="dg2-seg">
        <label class="dg2-seg-o"><input type="radio" name="famMode" value="creer" checked onchange="toggleFamMode('creer')"/>Créer un compte</label>
        <label class="dg2-seg-o"><input type="radio" name="famMode" value="lier" onchange="toggleFamMode('lier')"/>Lier un compte existant</label>
      </div>
      <div id="famCreerGroup" style="display:flex;flex-direction:column;gap:15px">
        <div class="v2-grid2">
          <div>
            <label class="v2-fld-l" for="famFormPrenom">Prénom</label>
            <input type="text" id="famFormPrenom" class="v2-fld"/>
          </div>
          <div>
            <label class="v2-fld-l" for="famFormNom">Nom</label>
            <input type="text" id="famFormNom" class="v2-fld"/>
          </div>
        </div>
        <div>
          <label class="v2-fld-l" for="famFormEmail">Email</label>
          <input type="email" id="famFormEmail" class="v2-fld" placeholder="famille@exemple.fr"/>
        </div>
      </div>
      <div id="famLierGroup" style="display:none">
        <label class="v2-fld-l" for="famFormEmailExistant">Email du compte famille existant</label>
        <input type="email" id="famFormEmailExistant" class="v2-fld" placeholder="famille@exemple.fr"/>
      </div>
      <div id="famCreatedInfo" class="v2-note v2-note-ok" style="display:none"></div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('famModal')">Fermer</button>
      <button type="button" class="v2-btn-pri" id="famSubmitBtn" onclick="soumettreCompteFamille()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/residents.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/documents-resident-supabase.js"></script>
<script src="js/famille-supabase.js"></script>
<script src="js/documents.js"></script>
<script src="js/documents-v2.js"></script>
</body>
</html>
