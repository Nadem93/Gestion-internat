<!-- MODALE — DEMANDE D'ATTESTATION DE SALAIRE -->

      <div><div class="v2-md-t">Attestation employeur</div><div class="v2-md-s">Demander une attestation de salaire à l'administration</div></div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalAttestation')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l">Type de document</label>
        <div class="v2-seg" id="mfpAttSeg">
          <button type="button" class="v2-seg-o on" data-motif="Attestation de salaire">Salaire</button>
          <button type="button" class="v2-seg-o" data-motif="Attestation employeur">Employeur</button>
          <button type="button" class="v2-seg-o" data-motif="Duplicata de bulletin">Duplicata</button>
        </div>
      </div>
      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="mfpAttDebut">Période — début</label>

        <div>
          <label class="v2-fld-l" for="mfpAttFin">Période — fin</label>
          <input type="month" class="v2-fld" id="mfpAttFin"/>
        </div>
      </div>
      <div>
        <label class="v2-fld-l" for="mfpAttCom">Précisions (facultatif)</label>
        <textarea class="v2-fld" id="mfpAttCom" placeholder="Destinataire, usage prévu…"></textarea>
      </div>
      <div class="v2-note v2-note-warn" id="mfpAttNote" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Le module de demandes n'est pas encore installé : exécuter migration-mes-fiches-paie.sql.
      </div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalAttestation')">Annuler</button>
      <button type="button" class="v2-btn-pri" id="mfpAttSubmit" onclick="MFPV2.soumettreAttestation()">Envoyer la demande</button>
    </div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>

<script src="js/supabase-client.js"></script>

<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/absences-supabase.js"></script>

<script src="js/config-supabase.js"></script>
<script src="js/money-mask.js"></script>
<script>
let _mfpFiche = null;
let _mfpCache = [];

function mfpFmtPeriode(p) {
  if (!p) return '';
  const [y, m] = p.split('-');
  const mois = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  return `${mois[parseInt(m, 10) - 1] || m} ${y}`;
}

async function initMesFichesPaie() {
  const s = Auth.requireAuth();
  if (!s) return;
  try {
    // Récupère le taux de cotisations / majoration partagé (pour un net estimé à jour)
    if (typeof hydrateConfigFromCloud === 'function') await hydrateConfigFromCloud();
    const employes = await sbGetEmployes();
    _mfpFiche = employes.find(e => String(e.profileId) === String(s.userId)) || null;
    window._mfpFiche = _mfpFiche;
    if (!_mfpFiche) {
      // Message historique : l'espace personnel exige employe.profile_id = compte connecté.
      MFPV2.infoBloc(
        "Votre compte n'est pas encore relié à une fiche salarié",
        "Contactez votre administrateur pour accéder à vos bulletins de paie.",
        '#f59e0b');
      renderMesFichesPaie();
      return;
    }
    // La RLS ne renvoie que les bulletins du salarié connecté ; on filtre par sécurité
    _mfpCache = (await sbGetFichesPaie()).filter(f => String(f.employeId) === String(_mfpFiche.id));
    window._mfpCache = _mfpCache;
    const annees = [...new Set(_mfpCache.map(f => (f.periode || '').slice(0, 4)).filter(Boolean))].sort((a, b) => b.localeCompare(a));
    document.getElementById('mfpAnnee').innerHTML = '<option value="">Toutes les années</option>' + annees.map(a => `<option value="${a}">${a}</option>`).join('');
    await MFPV2.chargerDemandes();
    renderMesFichesPaie();
  } catch (e) {
    console.error('[initMesFichesPaie]', e);
    MFPV2.infoBloc('Erreur de chargement', String(e?.message || e), '#ef4444');
    renderMesFichesPaie();
  }
}

// Rendu délégué au module V2 (js/mes-fiches-paie-v2.js) : les appelants
// historiques (onchange du select, init) continuent de fonctionner.
function renderMesFichesPaie() {
  window._mfpCache = _mfpCache;
  window._mfpFiche = _mfpFiche;
  MFPV2.render();
}

async function mfpDownload(id) {
  const f = _mfpCache.find(x => x.id === id);
  if (!f || !f.fichierPath) return;
  const url = await sbJustificatifUrl(f.fichierPath);
  if (url) window.open(url, '_blank'); else toast('Bulletin introuvable', 'error');
}

document.addEventListener('DOMContentLoaded', initMesFichesPaie);
</script>
<script src="js/mes-fiches-paie-v2.js"></script>
