<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><link rel="apple-touch-icon" href="icon-192.png"/><meta name="theme-color" content="#0f2b4a"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Journal de bord — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* Champs plats (sans effet de profondeur) dans le modal de rédaction */
    #modalEntry input,
    #modalEntry select,
    #modalEntry textarea {
      background: #fff;
      box-shadow: none;
      border: 1px solid rgba(15,43,74,.15);
    }
    #modalEntry input:focus,
    #modalEntry select:focus,
    #modalEntry textarea:focus {
      box-shadow: 0 0 0 3px rgba(15,43,74,.12);
      border-color: var(--primary);
    }

    /* ═══════════ Design « Fil du journal » (timeline chronologique) ═══════════ */
    @keyframes jGlow{0%,100%{opacity:.6}50%{opacity:1}}
    /* Fond aurora clair, identique aux autres pages */
    body{background:radial-gradient(130% 110% at 50% -8%,#f3f6ff,#dde6f6 66%) !important;background-attachment:fixed !important}
    /* Fil chronologique vertical le long de la liste */
    #entriesList{position:relative;padding-left:64px}
    #entriesList::before{content:'';position:absolute;left:46px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#38bdf8,#f472b6)}
    /* Cartes en verre + nœud coloré (couleur de la catégorie) posé sur le fil.
       Pas de !important sur le fond : les entrées « non lues » gardent leur surbrillance inline. */
    .entry-card{position:relative;background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.82);box-shadow:0 5px 16px rgba(80,90,200,.1)}
    .entry-card::before{content:'';position:absolute;left:-25px;top:18px;width:14px;height:14px;border-radius:50%;z-index:2;background:var(--jc,#8b5cf6);border:3px solid #fff;box-shadow:0 0 8px color-mix(in srgb,var(--jc,#8b5cf6) 70%,transparent);animation:jGlow 2.4s ease-in-out infinite}
    /* Heure de l'entrée, posée au niveau du point coloré (entre le point et la carte) */
    .entry-time{position:absolute;left:-68px;top:17px;width:34px;text-align:right;font-size:.7rem;font-weight:700;color:#64748b;line-height:1.15;white-space:nowrap;pointer-events:none}
    .entry-card:hover{box-shadow:0 12px 30px rgba(80,90,200,.16);border-color:rgba(167,139,250,.4)}
    @media(prefers-reduced-motion:reduce){.entry-card::before{animation:none}}
  </style>
</head>
<body class="v2">
<div class="app-layout">
  <div class="main">
    <div class="v2-shell">
    <div class="v2-top">
      <a class="v2-logo" href="accueil.html">I</a>
      <div style="line-height:1.15;min-width:0">
        <div class="v2-eyebrow">INTERNALIS · Suivi individualisé</div>
        <div class="v2-top-title">Journal de bord</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap">
        <div class="search-box" style="width:260px;max-width:100%">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="jSearch" placeholder="Rechercher…"/>
        </div>
        <button id="btnExportJournal" class="btn btn-ghost btn-sm" onclick="exportJournalPDF()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Exporter PDF
        </button>
        <button class="btn btn-accent btn-sm btn-add-resident" onclick="showNewEntryForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:15px;height:15px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span class="btn-add-label">Nouvelle entrée</span>
        </button>
      </div>
    </div>

    <div class="v2-body">
      <!-- VUE LISTE -->
      <div id="journalListView">
        <div class="v2-chips" id="jrChips" style="margin-bottom:14px"></div>
        <div class="toolbar" style="margin-bottom:18px;gap:.6rem">
          <select id="jFilterResident" style="width:auto"><option value="">Tous les résidents</option></select>
          <select id="jFilterCat" style="width:auto;display:none"><option value="">Toutes les catégories</option></select>
          <input type="date" id="jFilterDate" style="width:auto" title="Date de début"/>
          <input type="date" id="jFilterDateEnd" style="width:auto" title="Date de fin"/>
          <button class="btn btn-ghost btn-sm" id="btnUnreadFilter" onclick="toggleUnreadFilter()" style="white-space:nowrap;margin-left:auto">
            <span id="unreadDot" style="width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;flex-shrink:0"></span>
            Non lus <span id="unreadCount" style="background:var(--blue);color:#fff;border-radius:var(--r-full);padding:1px 6px;font-size:.7rem;margin-left:2px">0</span>
          </button>
        </div>

        <div class="v2-jr-body">
          <div id="entriesList"></div>
          <div style="display:flex;flex-direction:column;gap:16px">
            <div class="v2-blk" id="jrCats"></div>
            <div class="v2-blk" id="jrTop"></div>
          </div>
        </div>

        <div class="v2-blk" id="jrSynthese" style="margin-top:18px"></div>
      </div>

      <!-- VUE FORMULAIRE -->
      <div id="journalFormView" style="display:none;max-width:1020px;margin:0 auto">
        <button class="btn btn-ghost btn-sm" onclick="showJournalList()" style="margin-bottom:1.25rem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><polyline points="15 18 9 12 15 6"/></svg>
          Retour à la liste
        </button>
        <div style="max-width:760px;margin:0 auto">
          <!-- Formulaire -->
          <div id="entryFormContainer"></div>
        </div>
      </div>
    </div>
    </div>
  </div>
</div>

<!-- MODAL NOUVELLE ENTRÉE -->
<div class="modal-overlay" id="modalEntry">
  <div class="modal lg" style="max-width:640px">
      <div class="modal-header" style="border-radius:20px 20px 0 0">
        <div>
          <div class="modal-title" id="modalEntryTitle">Nouvelle entrée</div>
          <div style="font-size:.7rem;color:var(--muted);margin-top:2px;font-weight:400">Observation au journal de bord</div>
        </div>
        <button class="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="entryId"/>
        <div class="form-row">
          <div class="form-group"><label class="required">Résident concerné</label><select id="eResident"><option value="">— Sélectionner —</option></select></div>
          <div class="form-group"><label class="required">Catégorie</label><select id="eCategorie" multiple size="3" style="height:auto"></select><div style="font-size:.65rem;color:var(--muted);margin-top:2px">Ctrl/Cmd+clic pour sélectionner plusieurs catégories</div></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Date et heure</label><input type="datetime-local" id="eDate"/></div>
          <div class="form-group"><label>Objectif lié</label><select id="eObjectif"><option value="">— Aucun —</option></select></div>
        </div>
        <div class="form-group"><label class="required">Contenu</label>
          <textarea id="eContenu" rows="6" placeholder="Décrivez l'événement, l'observation ou l'intervention…"></textarea>
        </div>
        <div class="form-group" style="background:#f0fdf4;border:1px solid #99e5dc55;border-radius:10px;padding:.7rem .8rem">
          <label style="color:#0f766e">🤝 Accompagnement apporté <span style="text-transform:none;letter-spacing:0;font-weight:400;color:#64748b">— ce que vous avez fait pour aider (facultatif)</span></label>
          <textarea id="eAccompagnement" rows="2" placeholder="Ex : incitation verbale, médiation avec un pair, reformulation des consignes, présence rassurante…" style="resize:vertical"></textarea>
          <select id="eNiveauSoutien" class="form-input" style="margin-top:.4rem">
            <option value="">Niveau de soutien — non précisé</option>
            <option value="autonomie">🟢 Autonomie — présence simple</option>
            <option value="supervision">🔵 Supervision / veille</option>
            <option value="verbal">🟡 Incitation / guidance verbale</option>
            <option value="partiel">🟠 Aide partielle</option>
            <option value="total">🔴 Aide totale</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Visibilité</label>
            <div style="display:flex;gap:1rem">
              <label class="checkbox-wrap"><input type="radio" name="eVisibilite" value="equipe" checked/> Équipe uniquement</label>
              <label class="checkbox-wrap"><input type="radio" name="eVisibilite" value="tous"/> Tous</label>
              <label class="checkbox-wrap"><input type="radio" name="eVisibilite" value="confidentiel"/> Confidentiel</label>
            </div>
          </div>
          <!-- SERAFIN-PH directe/indirecte : calculé auto depuis le niveau de soutien -->
        </div>
      </div>

      <div class="modal-footer" style="border-radius:0 0 20px 20px;justify-content:space-between">
        <button class="btn btn-danger btn-sm" id="btnDeleteEntry" style="display:none" onclick="deleteEntry()">Supprimer</button>
        <div style="display:flex;gap:.5rem;margin-left:auto">
          <button class="btn btn-ghost" onclick="closeAllModals()">Annuler</button>
          <button class="btn btn-primary" onclick="saveEntry()">Enregistrer</button>
        </div>
      </div>

  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script>
  Auth.requireAuth();
  const _s = Auth.getSession();
  if (_s && _s.role === 'admin') {
    document.getElementById('btnExportJournal').style.display = '';
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/search-global.js"></script>
<script src="js/config-supabase.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/journal.js"></script>
<script src="js/journal-v2.js"></script>
</body>
</html>
