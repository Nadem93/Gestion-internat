<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Satisfaction résidents — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-satisfaction.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(245,158,11,.18)">

  <div class="v2-top">
    <a class="v2-logo" href="accueil.html" style="background:linear-gradient(135deg,#f59e0b,#fcd34d);color:#0a1728">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" style="width:20px;height:20px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Dossiers &amp; suivi</div>
      <div class="v2-top-title">Satisfaction résidents</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <button type="button" class="v2-btn v2-btn-primary" onclick="openSatModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouveau questionnaire
      </button>
    </div>
  </div>

  <div class="v2-body">

    <!-- Onglets -->
    <div class="v2-chips sa2-tabs">
      <button type="button" class="v2-chip-f active" id="satTabResultats"><span class="dot" style="background:#f59e0b"></span>Résultats</button>
      <button type="button" class="v2-chip-f" id="satTabFormulaires"><span class="dot" style="background:#818cf8"></span>Questionnaires</button>
      <button type="button" class="v2-chip-f" id="satTabQuestions" style="display:none"><span class="dot" style="background:#22d3ee"></span>Questions</button>
    </div>

    <!-- Tuiles statistiques -->
    <div class="sa2-stats">
      <div class="sa2-stat" style="--pc:#fcd34d">
        <span class="sa2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
        <div><div class="sa2-stat-n" id="satStatTotal">—</div><div class="sa2-stat-l">Questionnaires</div></div>
      </div>
      <div class="sa2-stat" style="--pc:#818cf8">
        <span class="sa2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <div><div class="sa2-stat-n" id="satStatMois">—</div><div class="sa2-stat-l">Ce mois-ci</div></div>
      </div>
      <div class="sa2-stat" style="--pc:#f59e0b">
        <span class="sa2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></span>
        <div><div class="sa2-stat-n" id="satStatScore">—</div><div class="sa2-stat-l">Satisfaction</div></div>
      </div>
      <div class="sa2-stat" style="--pc:#10b981">
        <span class="sa2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>
        <div><div class="sa2-stat-n" id="satStatDelta">—</div><div class="sa2-stat-l">vs trimestre</div></div>
      </div>
    </div>

    <!-- Contenu de la vue active -->
    <div id="satContent"></div>

  </div>
</div>

<!-- MODALE QUESTIONNAIRE -->
<div class="v2-ov" id="modalSat">
  <div class="v2-md" style="--mc:#f59e0b">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
      <div><div class="v2-md-t" id="satModalTitle">Nouveau questionnaire</div><div class="v2-md-s">Recueil de la satisfaction du résident ou de sa famille</div></div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalSat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <div><label class="v2-fld-l" for="satModalResidentId">Résident concerné</label>
        <select id="satModalResidentId" class="v2-fld"><option value="">— Non spécifié —</option></select></div>
      <div class="v2-grid2">
        <div><label class="v2-fld-l" for="satModalRepondant">Répondant (résident / famille)</label>
          <input type="text" id="satModalRepondant" class="v2-fld" placeholder="Prénom Nom ou Anonyme"/></div>
        <div><label class="v2-fld-l" for="satModalLien">Lien avec le résident</label>
          <input type="text" id="satModalLien" class="v2-fld" placeholder="Ex : famille, résident lui-même…"/></div>
      </div>
      <div><label class="v2-fld-l" for="satModalDate">Date *</label>
        <input type="date" id="satModalDate" class="v2-fld"/></div>

      <!-- Questions générées dynamiquement (sat2ModalQ) -->
      <div id="satModalQuestions"></div>

      <div><label class="v2-fld-l" for="satModalCommentaire">Commentaire libre</label>
        <textarea id="satModalCommentaire" class="v2-fld" rows="3" placeholder="Remarques, suggestions d'amélioration…"></textarea></div>

      <div class="v2-note v2-note-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        Un score moyen très faible déclenche une proposition de signalement (EIG) à l'enregistrement.
      </div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalSat')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="saveSatisfaction()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/satisfaction-supabase.js"></script>
<script src="js/satisfaction.js?v=2"></script>
<script src="js/satisfaction-v2.js?v=2"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
