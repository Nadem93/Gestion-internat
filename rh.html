<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RH — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    html,body{margin:0;height:100%}
    .rh-layout{display:flex;height:calc(100vh - var(--header-h));overflow:hidden;background:transparent}
    .rh-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
    #rhFrame{flex:1;width:100%;border:none}

    /* ── Dock flottant ── */
    .rh-dock{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:60;
      display:flex;align-items:center;gap:5px;
      background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(12px);
      border-radius:17px;padding:6px 9px;
      border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(80,90,160,.18);
      max-width:calc(100vw - 24px);overflow-x:auto}
    .rh-dock::-webkit-scrollbar{height:0}
    .rh-dock-sep{width:1px;height:26px;flex-shrink:0;background:rgba(15,23,42,.1);margin:0 3px;align-self:center}
  </style>
</head>
<body>
<header class="header">
  <div class="header-info"><div class="header-title">Ressources humaines</div></div>
  <div class="header-right"></div>
</header>
<div class="rh-layout">
  <div class="rh-main">
    <span id="rhTopTitle" style="display:none">Tableau de bord RH</span>
    <iframe id="rhFrame" src="rh-dashboard.html?embed=1"></iframe>
  </div>
</div>

<!-- Dock flottant (rempli par le script) -->
<nav class="rh-dock" id="rhDock" aria-label="Navigation RH"></nav>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/portal-dock.js"></script>
<script>
  Auth.requireAuth();
  if (!Auth.isRH()) {
    document.body.innerHTML = '<div class="empty" style="padding:3rem;text-align:center"><h3>Accès réservé</h3><p>Ce module est réservé à l\'encadrement / RH.</p><a href="accueil.html" class="btn btn-accent">← Accueil</a></div>';
  } else {
    // ── Les 15 modules RH (mêmes data-page, couleurs et icônes que l'ancienne barre) ──
    const RH_NAV = [
      { g:"Vue d'ensemble", page:'rh-dashboard.html', label:'Tableau de bord RH', c1:'#6366f1', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' },
      { g:"Vue d'ensemble", page:'admin.html?tab=employes', label:'Utilisateurs', c1:'#8b5cf6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>' },
      { g:"Vue d'ensemble", page:'contacts-externes.html', label:'Contacts extérieurs', c1:'#e11d48', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="2"/><path d="M8 16a4 4 0 0 1 8 0"/></svg>' },
      { g:'Contrats & absences', page:'contrats.html', label:'Contrats', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>' },
      { g:'Contrats & absences', page:'absences.html', label:'Absences & AT', c1:'#ef4444', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' },
      { g:'Contrats & absences', page:'conges.html', label:'Demandes congés', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>' },
      { g:'Temps de travail', page:'pointage.html', label:'Pointage', c1:'#0d9488', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
      { g:'Temps de travail', page:'planning-equipe.html', label:'Planning équipe', c1:'#2563eb', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
      { g:'Temps de travail', page:'astreintes.html', label:'Astreintes', c1:'#7c3aed', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' },
      { g:'Carrière & paie', page:'entretiens.html', label:'Entretien pro', c1:'#db2777', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' },
      { g:'Carrière & paie', page:'formations.html', label:'Formation', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' },
      { g:'Carrière & paie', page:'paie.html', label:'Fiches de paie', perm:'access_paie', c1:'#ea580c', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
      { g:'Recrutement & outils', page:'recrutement.html', label:'Recrutement', c1:'#0284c7', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>' },
      { g:'Recrutement & outils', page:'viatrajectoire.html', label:'ViaTrajectoire', adminOnly:true, c1:'#0d9488', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>' }
    ];
    // Accès rapides du dock (dans l'ordre) + libellés courts
    const QUICK = ['rh-dashboard.html', 'admin.html?tab=employes', 'conges.html', 'planning-equipe.html', 'formations.html'];
    const SHORT = { 'rh-dashboard.html':'Tableau', 'admin.html?tab=employes':'Utilisateurs', 'conges.html':'Congés', 'planning-equipe.html':'Planning', 'formations.html':'Formation' };
    const GROUPS = ["Vue d'ensemble", 'Contrats & absences', 'Temps de travail', 'Carrière & paie', 'Recrutement & outils'];

    const sess = Auth.getSession();
    const allowed = e => {
      if (e.adminOnly && !Auth.isAdmin()) return false;               // ViaTrajectoire : admin only
      if (e.perm && !(Auth.isAdmin() || e.perm.split(',').some(p => hasPermission(sess.userId, p)))) return false; // ex. Fiches de paie
      return true;
    };
    const entryOf = page => RH_NAV.find(e => e.page === page);

    const frame = document.getElementById('rhFrame');
    const title = document.getElementById('rhTopTitle');

    function loadPage(page, label) {
      // embed=1 : la page embarquée masque son titre et réserve elle-même l'espace du dock
      // (l'iframe descend jusqu'en bas de l'écran — aucune ligne de coupe au-dessus du dock)
      frame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
      if (title) title.textContent = label || '';
      if (window.PortalDock) PortalDock.setActive(page);
      sessionStorage.setItem('rh_last_page', page);
    }

    // ── Dock « par catégories » — 1 pastille par groupe + popover (composant partagé) ──
    const GROUP_META = {
      "Vue d'ensemble":       { short: 'Équipe',      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>' },
      'Contrats & absences':  { short: 'Contrats',    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>' },
      'Temps de travail':     { short: 'Temps',       icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>' },
      'Carrière & paie':      { short: 'Carrière',    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>' },
      'Recrutement & outils': { short: 'Recrutement', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>' }
    };
    const _rhLast = sessionStorage.getItem('rh_last_page');
    const _rhLastE = _rhLast && entryOf(_rhLast);
    PortalDock.init({
      dock: document.getElementById('rhDock'),
      nav: RH_NAV, key: 'page', groups: GROUPS, groupMeta: GROUP_META,
      allowed, onNavigate: e => loadPage(e.page, e.label),
      current: (_rhLastE && allowed(_rhLastE)) ? _rhLastE.page : RH_NAV[0].page
    });

    // Si une page chargée navigue vers l'accueil (clic maison), on sort de l'iframe
    frame.addEventListener('load', () => {
      try {
        const loadedFile = frame.contentWindow.location.pathname.split('/').pop();
        if (loadedFile === 'accueil.html') window.top.location.href = 'accueil.html';
      } catch (e) { /* origine différente */ }
    });

    // Reprend la page affichée avant un rafraîchissement, sinon le tableau de bord
    const lastPage = sessionStorage.getItem('rh_last_page');
    const lastEntry = lastPage && entryOf(lastPage);
    if (lastEntry && allowed(lastEntry)) loadPage(lastEntry.page, lastEntry.label);
    else loadPage(RH_NAV[0].page, RH_NAV[0].label);
  }
</script>
</body></html>
