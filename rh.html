<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RH — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-rh.css"/>
  <link rel="stylesheet" href="css/v2-carte-donnee.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">

<div class="v2-shell rh-shell">

  <!-- Navigation latérale retirée : l'accès aux modules passe par les tuiles
       « Accès rapides » de l'accueil du portail (rh2Cards). Le code de rendu du
       rail a été supprimé avec lui. -->

  <!-- ── Panneau principal ── -->
  <div class="rh-main">
    <div class="rh-topbar">
      <a class="rh-back on" id="rhAccueil" href="accueil.html" title="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 10v10h13V10"/></svg>
        Accueil
      </a>
      <button type="button" class="rh-back" id="rhBack" onclick="showHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Ressources humaines
      </button>
      <div class="rh-topbar-t" id="rhTopTitle">Ressources humaines</div>
      <div class="rh-topbar-m" id="rhTopMeta"></div>
    </div>
    <div class="rh-scroll">
      <main class="v2-body" id="rhHome"><div id="rhWelcome"></div></main>
      <iframe id="rhFrame" title="Contenu RH" style="display:none"></iframe>
    </div>
  </div>

</div>

<!-- ── Mode d'emploi d'un module (gabarit de modale V2) ── -->
<div class="v2-ov" id="rhTutoOv" role="dialog" aria-modal="true" aria-labelledby="rhTutoT">
  <div class="v2-md" style="--mc:#6366f1">
    <div class="v2-md-h">
      <span class="v2-md-ico rh-md-ico" id="rhTutoIco"></span>
      <div><div class="v2-md-t" id="rhTutoT"></div><div class="v2-md-s" id="rhTutoS"></div></div>
      <button class="v2-md-x" type="button" onclick="rh2CloseTuto()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="v2-md-b" id="rhTutoB"></div>
    <div class="v2-md-f">
      <button class="v2-btn-sec" type="button" onclick="rh2CloseTuto()">Fermer</button>
      <button class="v2-btn-pri" type="button" onclick="rh2OuvrirTuto()">Ouvrir le module</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/contrats-supabase.js"></script>
<script src="js/conges-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/entretiens-supabase.js"></script>
<script src="js/fiches-paie-supabase.js"></script>
<script src="js/portal-tuto-data.js"></script>
<script>
  Auth.requireAuth();
  if (!Auth.isRH()) {
    // Accès réservé : le contrôle d'accès du module RH est inchangé.
    document.body.innerHTML = '<div class="v2-shell rh-shell" style="display:block"><div class="rh-deny">'
      + '<h3>Accès réservé</h3><p>Ce module est réservé à l\'encadrement / RH.</p>'
      + '<a href="accueil.html" class="v2-btn">← Accueil</a></div></div>';
  } else {
    // ── Les modules RH (mêmes data-page, couleurs et icônes qu'avant) ──
    const RH_NAV = [
      { g:"Vue d'ensemble", page:'rh-dashboard.html', label:'Tableau de bord RH', c1:'#6366f1', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' },
      { g:"Vue d'ensemble", page:'admin.html?tab=employes', label:'Employés', c1:'#8b5cf6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' },
      { g:"Vue d'ensemble", page:'contacts-externes.html', label:'Contacts extérieurs', c1:'#e11d48', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M13 8h5M13 12h5M6 16h12"/></svg>' },
      { g:'Contrats & absences', page:'contrats.html', label:'Contrats', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' },
      { g:'Contrats & absences', page:'absences.html', label:'Absences & AT', c1:'#ef4444', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' },
      { g:'Contrats & absences', page:'conges.html', label:'Demandes congés', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' },
      { g:'Temps de travail', page:'pointage.html', label:'Pointage', c1:'#0d9488', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
      { g:'Temps de travail', page:'planning-equipe.html', label:'Planning équipe', c1:'#2563eb', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
      { g:'Temps de travail', page:'astreintes.html', label:'Astreintes', c1:'#7c3aed', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' },
      { g:'Carrière & paie', page:'entretiens.html', label:'Entretien pro', c1:'#db2777', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' },
      { g:'Carrière & paie', page:'formations.html', label:'Formation', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' },
      { g:'Carrière & paie', page:'paie.html', label:'Fiches de paie', perm:'access_paie', c1:'#ea580c', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>' },
      { g:'Recrutement & outils', page:'recrutement.html', label:'Recrutement', c1:'#0284c7', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>' },
      { g:'Recrutement & outils', page:'diagnostic-droits.html', label:'Diagnostic droits', adminOnly:true, c1:'#475569', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' },
      { g:'Recrutement & outils', page:'viatrajectoire.html', label:'ViaTrajectoire', adminOnly:true, c1:'#0d9488', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' }
    ];
    const GROUPS = ["Vue d'ensemble", 'Contrats & absences', 'Temps de travail', 'Carrière & paie', 'Recrutement & outils'];

    const sess = Auth.getSession();
    // Contrôle d'accès par module — INCHANGÉ (données de paie / contrat / évaluation)
    const allowed = e => {
      if (e.adminOnly && !Auth.isAdmin()) return false;               // ViaTrajectoire, Diagnostic droits : admin only
      if (e.perm && !(Auth.isAdmin() || e.perm.split(',').some(p => hasPermission(sess.userId, p)))) return false; // ex. Fiches de paie
      return true;
    };
    const entryOf = page => RH_NAV.find(e => e.page === page);

    const frame = document.getElementById('rhFrame');
    const rhHome = document.getElementById('rhHome');
    const rhTitle = document.getElementById('rhTopTitle');
    const rhBack = document.getElementById('rhBack');

    // ── Navigation interne : la page s'ouvre dans le panneau ──
    function showHome() {
      frame.style.display = 'none';
      frame.src = 'about:blank';
      rhHome.style.display = '';
      rhBack.classList.remove('on');
      rhTitle.textContent = 'Ressources humaines';
      window.rhCurrentPage = null;
      sessionStorage.removeItem('rh_last_page');
      renderRhHome();
    }
    function loadPage(page, label) {
      // embed=1 : la page embarquée masque son propre titre
      rhHome.style.display = 'none';
      frame.style.display = '';
      frame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
      rhBack.classList.add('on');
      rhTitle.textContent = label || '';
      window.rhCurrentPage = page;
      sessionStorage.setItem('rh_last_page', page);
    }

    // Si une page chargée renvoie vers l'accueil ou le hub RH, on sort de l'iframe
    frame.addEventListener('load', () => {
      try {
        const f = frame.contentWindow.location.pathname.split('/').pop();
        if (f === 'accueil.html') window.top.location.href = 'accueil.html';
        else if (f === 'rh.html') window.top.location.href = 'rh.html';
      } catch (e) { /* origine différente, on ignore */ }
    });

    // Le rendu vit dans js/rh-v2.js (maquette V2) : tous les appelants passent par ici.
    function renderRhHome() { if (typeof rh2Render === 'function') rh2Render(); }

    // Contrat avec le module de rendu V2 (un `const` de premier niveau ne crée
    // pas de propriété sur window : on les publie explicitement).
    window.RH_NAV = RH_NAV;
    window.RH_GROUPS = GROUPS;
    window.rhAllowed = allowed;
    window.loadPage = loadPage;
    window.showHome = showHome;
    window.renderRhHome = renderRhHome;
    window.rhCurrentPage = null;

    // Reprend la rubrique affichée avant un rafraîchissement
    const lastPage = sessionStorage.getItem('rh_last_page');
    const lastEntry = lastPage && entryOf(lastPage);
    if (lastEntry && allowed(lastEntry)) loadPage(lastEntry.page, lastEntry.label);
  }
</script>
<script src="js/rh-v2.js"></script>
<script>if (typeof window.renderRhHome === 'function') window.renderRhHome();</script>
<script src="js/mobile-nav.js"></script>
</body></html>
