<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Messages — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-messages.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(2,132,199,.22)">

  <div class="v2-top">
    <a class="v2-logo" href="accueil.html" style="background:linear-gradient(135deg,#0284c7,#38bdf8)" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Équipe &amp; échanges</div>
      <div class="v2-top-title">Messages</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span id="convCount" class="ms-unread-tag"></span>
      <button type="button" class="v2-btn v2-btn-primary" onclick="openCompose(null)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouveau
      </button>
    </div>
  </div>

  <div class="v2-body">
    <div class="ms-layout msg-wrap" id="msLayout">

      <!-- ── COLONNE CONVERSATIONS ── -->
      <aside class="ms-side msg-left">
        <div class="ms-side-h">
          <div class="ms-side-t">
            <span>Conversations</span>
            <button type="button" class="ms-new" onclick="openCompose(null)" title="Nouveau message" aria-label="Nouveau message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <label class="ms-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="convSearch" placeholder="Rechercher…" oninput="renderConvs()" aria-label="Rechercher une conversation"/>
          </label>
          <div class="v2-chips ms-chips" id="msChips"></div>
        </div>
        <div class="ms-convs chat-convs" id="chatConvs"></div>
      </aside>

      <!-- ── COLONNE FIL DE DISCUSSION ── -->
      <section class="ms-thread msg-right" id="chatMain">

        <div class="ms-th-h" id="chatMainHeader" style="display:none">
          <button type="button" class="ms-back" onclick="backToList()" title="Retour à la liste" aria-label="Retour à la liste">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="ms-th-av" id="chatMainAvatar">?</div>
          <div style="min-width:0">
            <div class="ms-th-n" id="chatMainName">—</div>
            <div class="ms-th-s" id="chatMainStatus"></div>
          </div>
          <div class="ms-th-act">
            <button type="button" class="ms-ico-btn" id="pinConvBtn" onclick="ms2TogglePinCurrent()" title="Épingler la conversation" aria-label="Épingler la conversation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5M9 10.76V6a3 3 0 0 1 6 0v4.76a2 2 0 0 0 .59 1.42l1.12 1.12A2 2 0 0 1 17 16H7a2 2 0 0 1-1.71-2.7l1.12-1.12A2 2 0 0 0 9 10.76z"/></svg>
            </button>
            <button type="button" class="ms-ico-btn" id="addParticipantBtn" style="display:none" onclick="openCompose(currentConvId)" title="Ajouter un participant" aria-label="Ajouter un participant">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button type="button" class="ms-ico-btn ms-ico-danger" onclick="deleteConv(currentConvId)" title="Supprimer la conversation" aria-label="Supprimer la conversation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>

        <div class="ms-msgs chat-msgs" id="chatMsgs"></div>

        <div class="ms-input" id="chatInputBar">
          <div class="ms-input-w">
            <textarea id="chatInput" rows="1" placeholder="Écrire un message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg()}" disabled></textarea>
          </div>
          <button type="button" class="ms-send" onclick="sendChatMsg()" id="sendBtn" disabled aria-label="Envoyer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- ── MODALE NOUVEAU MESSAGE / AJOUT DE PARTICIPANTS ── -->
<div class="v2-ov" id="composeOverlay">
  <div class="v2-md" style="--mc:#38bdf8;max-width:520px">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
      <div style="min-width:0">
        <h3 class="v2-md-t" style="margin:0">Nouveau message</h3>
        <div class="v2-md-s">Sélectionnez un ou plusieurs collègues</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeCompose()" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l" for="composeSearch">Rechercher</label>
        <input type="text" class="v2-fld" id="composeSearch" placeholder="Nom, prénom, fonction…" oninput="renderComposeUsers()"/>
      </div>
      <div class="ms-cp-list chat-overlay-list" id="composeList"></div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeCompose()">Annuler</button>
      <button type="button" class="v2-btn-pri" id="composeStartBtn" disabled onclick="startComposeConv()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="composeStartLbl">Démarrer</span>
      </button>
    </div>
  </div>
</div>
<div id="composeBackdrop" class="ms-never"></div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script>Auth.requireAuth(); if (!requireModule('access_messages')) { const b = document.querySelector('.v2-body'); if (b) b.innerHTML = ''; }</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/profiles-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/messages.js?v=2"></script>
<script src="js/messages-v2.js?v=2"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
