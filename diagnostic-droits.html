<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#0a1728"/>
  <title>Diagnostic des droits &amp; obligations — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-diagnostic-droits.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(71,85,105,.28)">

  <div class="v2-top">
    <a class="v2-logo" href="rh.html" style="background:linear-gradient(135deg,#475569,#94a3b8)" title="Retour au portail RH">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · RH</div>
      <div class="v2-top-title">Diagnostic des droits &amp; obligations</div>
    </div>
    <div class="dd2-top-act" id="dd2TopActions">
      <a href="rh.html" class="v2-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Portail RH
      </a>
      <button type="button" id="dd2BtnRapport" class="v2-btn v2-btn-primary" onclick="dd2Rapport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Rapport de conformité
      </button>
    </div>
  </div>

  <div class="v2-body" id="dd2Body">

    <!-- ══ Score global + tuiles de synthèse ══════════════════════════════ -->
    <div class="dd2-head">
      <div class="dd2-score" id="dd2Score"></div>
      <div class="dd2-stats" id="dd2Stats"></div>
    </div>

    <!-- ══ Domaines de conformité + rail ══════════════════════════════════ -->
    <div class="dd2-main">
      <div>
        <div class="dd2-titre">Domaines de conformité</div>
        <div class="dd2-liste" id="dd2Domaines"></div>
      </div>

      <div class="dd2-rail">
        <div class="v2-blk dd2-blk-alerte">
          <div class="v2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="2" style="width:15px;height:15px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>
            <span class="v2-blk-t">Points de vigilance</span>
          </div>
          <div id="dd2Vigilance"></div>
        </div>

        <div class="v2-blk">
          <div class="v2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" style="width:15px;height:15px"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span class="v2-blk-t">Plan d'action</span>
            <button type="button" class="dd2-lien" id="dd2BtnAction" onclick="dd2OpenAction()">+ Action</button>
          </div>
          <div id="dd2Actions"></div>
        </div>

        <div class="v2-blk">
          <div class="v2-blk-h">
            <span class="v2-blk-t">Veille réglementaire</span>
            <button type="button" class="dd2-lien" id="dd2BtnVeille" onclick="dd2OpenVeille()">+ Texte</button>
          </div>
          <div id="dd2Veille"></div>
        </div>
      </div>
    </div>

    <!-- ══ Auto-diagnostic + évolution du score ═══════════════════════════ -->
    <div class="dd2-g2">
      <div class="v2-blk" id="dd2QBlock">
        <div class="v2-blk-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" style="width:15px;height:15px"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="v2-blk-t" id="dd2QTitre">Auto-diagnostic</span>
          <span class="dd2-meta" id="dd2QMeta"></span>
        </div>
        <div id="dd2Questions"></div>
      </div>

      <div class="v2-blk">
        <div class="v2-blk-h">
          <span class="v2-blk-t">Évolution du score</span>
          <span class="dd2-meta" id="dd2Delta" style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:800"></span>
        </div>
        <div id="dd2Evolution"></div>
        <div style="margin-top:14px;display:flex">
          <button type="button" class="v2-btn v2-btn-sm" id="dd2BtnReleve" onclick="dd2Releve()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
            Enregistrer le relevé du trimestre
          </button>
        </div>
      </div>
    </div>

    <!-- ══ Risques · Échéancier · Référents ═══════════════════════════════ -->
    <div class="dd2-g3">
      <div class="v2-blk dd2-blk-alerte">
        <div class="v2-blk-h"><span class="v2-blk-t">Exposition aux risques</span></div>
        <div id="dd2Risques"></div>
      </div>

      <div class="v2-blk">
        <div class="v2-blk-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" style="width:15px;height:15px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
          <span class="v2-blk-t">Échéancier légal</span>
        </div>
        <div id="dd2Echeancier"></div>
      </div>

      <div class="v2-blk">
        <div class="v2-blk-h"><span class="v2-blk-t">Référents désignés</span></div>
        <div id="dd2Referents"></div>
      </div>
    </div>

  </div>
</div>

<!-- Modales du module V2 (action, veille, référent) — gabarit .v2-ov/.v2-md -->
<div class="v2-ov" id="dd2Modal"></div>

<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/diagnostic-droits.js"></script>
<script src="js/diagnostic-droits-v2.js"></script>
</body>
</html>
