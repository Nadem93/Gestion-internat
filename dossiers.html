<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dossiers & suivi — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    html,body{margin:0;height:100%}
    .rh-layout{display:flex;height:calc(100vh - var(--header-h));overflow:hidden;background:#e2ebfd}
    .rh-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
    #dsFrame{flex:1;width:100%;border:none;background:#fff}

    /* ── Dock flottant ── */
    .rh-dock{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:60;
      display:flex;align-items:center;gap:5px;
      background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(12px);
      border-radius:17px;padding:6px 9px;
      border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(80,90,160,.18);
      max-width:calc(100vw - 24px);overflow-x:auto}
    .rh-dock::-webkit-scrollbar{height:0}
    .rh-dock-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;flex-shrink:0;
      padding:5px 3px;border-radius:12px;border:none;background:none;color:#64748b;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
    .rh-dock-item:hover{background:rgba(15,23,42,.05);color:#334155}
    .rh-dock-item.active{background:#eef2ff;color:#4f46e5}
    .rh-dock-item svg{width:18px;height:18px;display:block}
    .rh-dock-item .lbl{font-size:.55rem;font-weight:600;white-space:nowrap}
    .rh-dock-home{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;
      border-radius:13px;border:none;background:rgba(15,23,42,.05);color:#64748b;cursor:pointer;transition:background .15s,color .15s}
    .rh-dock-home:hover{background:rgba(15,23,42,.1);color:#334155}
    .rh-dock-home svg{width:17px;height:17px}
    .rh-dock-grid{width:42px;height:42px;flex-shrink:0;border-radius:16px;border:none;
      background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;
      cursor:pointer;box-shadow:0 5px 13px rgba(79,70,229,.5);transition:transform .15s,box-shadow .15s}
    .rh-dock-grid:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.6)}
    .rh-dock-grid svg{width:19px;height:19px}

    /* ── Popover « Tous les modules » ── */
    .rh-pop-overlay{position:fixed;inset:0;z-index:59;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none}
    .rh-pop-overlay.open{display:block}
    .rh-pop{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);z-index:61;
      background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(15,43,74,.3);
      padding:20px 22px;max-width:calc(100vw - 28px);max-height:calc(100vh - 160px);overflow:auto;display:none}
    .rh-pop.open{display:block}
    .rh-pop-title{font-size:.9rem;font-weight:800;color:#0f2b4a;margin-bottom:14px}
    .rh-pop-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:20px}
    .rh-pop-col-title{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:8px}
    .rh-pop-link{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;border:none;background:none;
      width:100%;text-align:left;font-family:inherit;font-size:.8rem;font-weight:500;color:#334155;cursor:pointer;transition:background .12s}
    .rh-pop-link:hover{background:#f1f5f9}
    .rh-pop-link.active{background:#eef2ff;color:#4f46e5;font-weight:700}
    .rh-pop-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
    @media(max-width:760px){.rh-pop-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.rh-pop-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="header">
  <div class="header-info" style="display:flex;align-items:center;gap:.7rem">
    <div class="header-title" id="dsTitle">📂 Dossiers &amp; suivi</div>
  </div>
  <div class="header-right"></div>
</header>

<div class="rh-layout">
  <div class="rh-main">
    <main class="content" id="dsHome" style="flex:1;overflow:auto;padding:1.75rem 1.5rem">
      <div style="max-width:640px;margin:0 auto">
        <div id="dsWelcome"></div>
      </div>
    </main>
    <iframe id="dsFrame" title="Contenu des dossiers" style="display:none"></iframe>
  </div>
</div>

<!-- Dock flottant + popover (remplis par le script) -->
<div class="rh-pop-overlay" id="dsPopOverlay"></div>
<div class="rh-pop" id="dsPop" role="dialog" aria-label="Tous les modules des dossiers"></div>
<nav class="rh-dock" id="dsDock" aria-label="Navigation des dossiers"></nav>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/notif-bell.js"></script>
<script>
  Auth.requireAuth();

  // ── Les 11 rubriques (mêmes data-page, permissions, 1re couleur et icônes que l'ancienne barre) ──
  const DS_NAV = [
    { g:'Admission & parcours', page:'admissions.html', label:'Admissions', perm:'access_admissions', c1:'#4f46e5', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>' },
    { g:'Admission & parcours', page:'ppe.html', label:'Avenants', perm:'access_ppe', c1:'#dc2626', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' },
    { g:'Admission & parcours', page:'echeances.html', label:'Échéancier', perm:'view_residents', c1:'#0369a1', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>' },
    { g:'Documents & évaluations', page:'documents.html', label:'Documents', perm:'access_documents', c1:'#8b5cf6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' },
    { g:'Documents & évaluations', page:'objectifs.html', label:'Objectifs & évaluations', perm:'view_residents', c1:'#d97706', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>' },
    { g:'Documents & évaluations', page:'plan-soins.html', label:'Plan de soins', perm:'view_residents', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-3-3v6"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>' },
    { g:'Documents & évaluations', page:'fiche-liaison.html', label:'Fiche de liaison hosp.', perm:'view_residents', c1:'#dc2626', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' },
    { g:'Vie sociale & qualité', page:'cvs.html', label:'Vie sociale (CVS)', perm:'access_cvs', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' },
    { g:'Vie sociale & qualité', page:'satisfaction.html', label:'Satisfaction résidents', perm:'view_residents', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' },
    { g:'Vie sociale & qualité', page:'eig.html', label:'Registre EIG', perm:'view_incidents', c1:'#b91c1c', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' },
    { g:'Vie sociale & qualité', page:'repertoire.html', label:'Répertoire', perm:'access_repertoire', c1:'#7c3aed', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' }
  ];
  // Accès rapides du dock (dans l'ordre) + libellés courts
  const QUICK = ['admissions.html', 'documents.html', 'objectifs.html', 'cvs.html', 'echeances.html'];
  const SHORT = { 'admissions.html':'Admissions', 'documents.html':'Documents', 'objectifs.html':'Objectifs', 'cvs.html':'CVS', 'echeances.html':'Échéancier' };
  const GROUPS = ['Admission & parcours', 'Documents & évaluations', 'Vie sociale & qualité'];

  const sess = Auth.getSession();
  // Masquage par permission : admin/superadmin voient tout ; sinon hasPermission
  const allowed = e => {
    if (!e.perm) return true;
    return !!sess && (sess.role === 'admin' || sess.role === 'superadmin' || hasPermission(sess.userId, e.perm));
  };
  const entryOf = page => DS_NAV.find(e => e.page === page);

  const dsFrame = document.getElementById('dsFrame');
  const dsHome = document.getElementById('dsHome');
  const dsTitle = document.getElementById('dsTitle');
  const pop = document.getElementById('dsPop');
  const overlay = document.getElementById('dsPopOverlay');

  function closePop() { pop.classList.remove('open'); overlay.classList.remove('open'); }
  function openPop() { pop.classList.add('open'); overlay.classList.add('open'); }
  function setActive(page) {
    document.querySelectorAll('.rh-dock-item').forEach(d => d.classList.toggle('active', d.dataset.page === page));
    document.querySelectorAll('.rh-pop-link').forEach(d => d.classList.toggle('active', d.dataset.page === page));
  }

  // ── Navigation interne : la page s'ouvre dans le panneau, le dock reste visible ──
  function showHome() {
    dsFrame.style.display = 'none';
    dsFrame.src = 'about:blank';
    dsHome.style.display = '';
    setActive(null);
    dsTitle.textContent = '📂 Dossiers & suivi';
    sessionStorage.removeItem('ds_last_page');
    closePop();
  }
  function loadPage(page, label) {
    dsHome.style.display = 'none';
    dsFrame.style.display = '';
    dsFrame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
    setActive(page);
    dsTitle.textContent = label || '';
    sessionStorage.setItem('ds_last_page', page);
    closePop();
  }

  // ── Dock : 2 accès rapides · maison · bouton central · 3 accès rapides ──
  const dockItem = page => {
    const e = entryOf(page);
    if (!e || !allowed(e)) return '';
    return `<button class="rh-dock-item" data-page="${e.page}" title="${e.label}"><span style="display:flex">${e.icon}</span><span class="lbl">${SHORT[page] || e.label}</span></button>`;
  };
  const homeBtn = `<button class="rh-dock-home" id="dsHomeBtn" title="Accueil des dossiers" aria-label="Accueil des dossiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>`;
  const gridBtn = `<button class="rh-dock-grid" id="dsGridBtn" title="Toutes les rubriques" aria-label="Toutes les rubriques"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>`;
  document.getElementById('dsDock').innerHTML =
    homeBtn + dockItem(QUICK[0]) + dockItem(QUICK[1]) + gridBtn + dockItem(QUICK[2]) + dockItem(QUICK[3]) + dockItem(QUICK[4]);

  // ── Popover : 3 colonnes = 3 groupes, entrées autorisées uniquement ──
  pop.innerHTML = `<div class="rh-pop-title">Toutes les rubriques</div><div class="rh-pop-grid">${
    GROUPS.map(g => `<div><div class="rh-pop-col-title">${g}</div>${
      DS_NAV.filter(e => e.g === g && allowed(e)).map(e =>
        `<button class="rh-pop-link" data-page="${e.page}"><span class="rh-pop-dot" style="background:${e.c1}"></span>${e.label}</button>`).join('')
    }</div>`).join('')
  }</div>`;

  // Clics (dock + popover) → loadPage
  document.querySelectorAll('.rh-dock-item, .rh-pop-link').forEach(b => {
    b.addEventListener('click', () => { const e = entryOf(b.dataset.page); loadPage(b.dataset.page, e ? e.label : ''); });
  });
  // Maison : accueil de la rubrique
  document.getElementById('dsHomeBtn').addEventListener('click', showHome);
  // Bouton central : ouvre/ferme le popover ; overlay : ferme
  document.getElementById('dsGridBtn').addEventListener('click', () => pop.classList.contains('open') ? closePop() : openPop());
  overlay.addEventListener('click', closePop);

  // Si une page chargée renvoie vers l'accueil ou les dossiers, on sort de l'iframe
  dsFrame.addEventListener('load', () => {
    try {
      const f = dsFrame.contentWindow.location.pathname.split('/').pop();
      if (f === 'accueil.html') window.top.location.href = 'accueil.html';
      else if (f === 'dossiers.html') window.top.location.href = 'dossiers.html';
    } catch (e) { /* origine différente, on ignore */ }
  });

  // Reprend la rubrique affichée avant un rafraîchissement
  const lastPage = sessionStorage.getItem('ds_last_page');
  const lastEntry = lastPage && entryOf(lastPage);
  if (lastEntry && allowed(lastEntry)) loadPage(lastEntry.page, lastEntry.label);

  // ── Accueil de la rubrique ──
  (function () {
    const s = Auth.getSession();
    const el = document.getElementById('dsWelcome');
    if (!el) return;
    const prenom = (s && (s.prenom || s.username) || '').trim();
    el.innerHTML = `
      <div style="font-size:1.35rem;font-weight:800;color:var(--primary);letter-spacing:-.02em">📂 Dossiers & suivi</div>
      <div style="font-size:.86rem;color:var(--muted);margin-top:.25rem">${prenom ? 'Bonjour ' + escHtml(prenom) + ' — c' : 'C'}hoisissez une rubrique dans le dock en bas de l'écran — elle s'ouvre ici, sans quitter la page.</div>`;
  })();
</script>
</body></html>
