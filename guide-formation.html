<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#0a1728"/>
  <title>Guide de formation — INTERNALIS</title>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-guide-formation.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">

<div class="v2-shell">

  <!-- BARRE DU HAUT -->
  <div class="v2-top">
    <a class="v2-logo" href="index.html" style="background:linear-gradient(135deg,#4f46e5,#6366f1)" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Aide &amp; prise en main</div>
      <div class="v2-top-title">Guide de formation</div>
    </div>
    <div class="gf-top-act">
      <label class="gf-search" for="gfSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="gfSearch" placeholder="Rechercher un module, une fonctionnalité…" aria-label="Rechercher dans le guide"/>
      </label>
      <button type="button" class="gf-btn" id="gfPrint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimer
      </button>
    </div>
  </div>

  <div class="v2-body">

    <!-- EN-TÊTE -->
    <div class="gf-head">
      <h1 class="v2-h1">Guide de formation INTERNALIS</h1>
      <div class="v2-sub">Vue d’ensemble complète des modules, fonctionnalités et synchronisations du logiciel de gestion d’internat.</div>
      <div class="gf-maj" id="gfMaj">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Mis à jour
      </div>
    </div>

    <!-- TUILES CHIFFRÉES -->
    <div class="gf-kgrid" id="gfKpis"></div>

    <!-- RAIL DE NAVIGATION + CONTENU -->
    <div class="gf-layout">
      <nav class="gf-rail" id="gfNav" aria-label="Sommaire du guide"></nav>
      <div class="gf-contenu" id="gfContenu"></div>
    </div>

  </div>
</div>

<script src="js/guide-formation-v2.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
