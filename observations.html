<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Observations &amp; échelles — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-observations.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(14,165,233,.2)">

  <div class="v2-top">
    <a class="v2-logo obs-logo" href="accueil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Suivi clinique</div>
      <div class="v2-top-title">Observations &amp; échelles</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <button id="btnObsNew" type="button" class="v2-btn v2-btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouvelle observation
      </button>
    </div>
  </div>

  <div class="v2-body">

    <!-- Barre : résident sélectionné + changement -->
    <div class="obs-toolbar">
      <div class="obs-resbox" id="obsResHead"></div>
      <select id="obsResident" class="obs-sel" aria-label="Choisir un résident"></select>
    </div>

    <!-- Dernier score par grille -->
    <div id="obsKpis" class="obs-kpis"></div>

    <!-- Courbe de tendance + historique -->
    <div class="obs-main">
      <div id="obsTrend" class="dc-card"></div>
      <div id="obsHistory" class="dc-card"></div>
    </div>

  </div>
</div>

<!-- MODALE : NOUVELLE OBSERVATION -->
<div class="v2-ov" id="obsModal">
  <div class="v2-md" style="--mc:#0ea5e9">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>
      <div><div class="v2-md-t">Nouvelle observation</div><div class="v2-md-s">Grille d'échelle clinique · <span id="obsMdWho" class="obs-md-who"></span></div></div>
      <button type="button" class="v2-md-x" onclick="obsCloseModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <input type="hidden" id="obsMdResident"/>
      <div>
        <label class="v2-fld-l">Grille</label>
        <div class="obs-gts" id="obsMdTabs"></div>
      </div>
      <div><label class="v2-fld-l" for="obsMdDate">Date d'observation</label><input type="date" id="obsMdDate" class="v2-fld"/></div>
      <div id="obsMdForm"></div>
      <div><label class="v2-fld-l" for="obsMdNotes">Notes (facultatif)</label><textarea id="obsMdNotes" class="v2-fld" rows="2" placeholder="Contexte, précisions, conduite tenue…"></textarea></div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="obsCloseModal()">Annuler</button>
      <button type="button" class="v2-btn-pri" id="obsMdSave" onclick="obsSave()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/observations-supabase.js"></script>
<script src="js/observations-v2.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
