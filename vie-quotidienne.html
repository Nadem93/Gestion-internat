<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Vie quotidienne — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-vie-quotidienne.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">

<div class="v2-shell vq-shell">

  <!-- Navigation latérale retirée : l'accès aux modules passe par les tuiles
       « Accès rapides » de l'accueil du portail (vq2Cards). Le code de rendu du
       rail a été supprimé avec lui. -->

  <!-- ── Panneau principal ── -->
  <div class="vq-main">
    <div class="vq-topbar">
      <a class="vq-back on" id="vqAccueil" href="accueil.html" title="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 10v10h13V10"/></svg>
        Accueil
      </a>
      <button type="button" class="vq-back" id="vqBack" onclick="showHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Vie quotidienne
      </button>
      <div class="vq-topbar-t" id="vqTitle">Vie quotidienne</div>
      <div class="vq-topbar-m" id="vqTopMeta"></div>
    </div>
    <div class="vq-scroll">
      <main class="v2-body" id="vqHome"><div id="vqWelcome"></div></main>
      <iframe id="vqFrame" title="Contenu de la vie quotidienne" style="display:none"></iframe>
    </div>
  </div>

</div>

<!-- ── Mode d'emploi d'un module (gabarit de modale V2) ── -->
<div class="v2-ov" id="vqTutoOv" role="dialog" aria-modal="true" aria-labelledby="vqTutoT">
  <div class="v2-md" style="--mc:#0d9488">
    <div class="v2-md-h">
      <span class="v2-md-ico" id="vqTutoIco"></span>
      <div><div class="v2-md-t" id="vqTutoT"></div><div class="v2-md-s" id="vqTutoS"></div></div>
      <button class="v2-md-x" type="button" onclick="vq2CloseTuto()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="v2-md-b" id="vqTutoB"></div>
    <div class="v2-md-f">
      <button class="v2-btn-sec" type="button" onclick="vq2CloseTuto()">Fermer</button>
      <button class="v2-btn-pri" type="button" onclick="vq2OuvrirTuto()">Ouvrir le module</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/presences-supabase.js"></script>
<script src="js/repas-supabase.js"></script>
<script src="js/medicaments-supabase.js"></script>
<script src="js/activites-supabase.js"></script>
<script src="js/plan-soins-supabase.js"></script>
<script src="js/transmissions-supabase.js"></script>
<script>
  Auth.requireAuth();

  // ── Les modules de la vie quotidienne (mêmes data-page, couleurs et icônes qu'avant) ──
  const VQ_NAV = [
    { g:'Suivi quotidien', page:'journee.html', label:'Journée — Ma tournée', perm:'access_journal', c1:'#4f46e5', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l3 2"/><path d="M9 17l2 2 4-4"/></svg>' },
    { g:'Suivi quotidien', page:'transmissions.html', label:'Transmissions', perm:'access_journal', c1:'#3b82f6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2v4l-4-4H9a1.994 1.994 0 0 1-1.414-.586m0 0L11 14h4a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2v4l.586-.586z"/></svg>' },
    { g:'Suivi quotidien', page:'presences.html', label:'Présences', perm:'access_presences', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' },
    { g:'Suivi quotidien', page:'nuit.html', label:'Cahier de nuit', perm:'access_journal', c1:'#6366f1', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' },
    { g:'Cadre de vie', page:'repas.html', label:'Repas & régimes', perm:'view_residents', c1:'#ea580c', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>' },
    { g:'Cadre de vie', page:'activites.html', label:'Activités éducatives', perm:'access_activites', c1:'#818cf8', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>' },
    { g:'Soins', page:'medicaments.html', label:'Médicaments', perm:'access_medicaments', c1:'#dc2626', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 21 10a4.95 4.95 0 1 0-7-7L3.5 13.5a4.95 4.95 0 1 0 7 7z"/><path d="m8.5 8.5 7 7"/></svg>' },
    { g:'Soins', page:'plan-soins.html', label:'Plan de soins', perm:'view_residents', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-3-3v6"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>' }
  ];
  const GROUPS = ['Suivi quotidien', 'Cadre de vie', 'Soins'];

  const sess = Auth.getSession();
  const allowed = e => {
    if (!e.perm) return true;
    return sess && (sess.role === 'admin' || sess.role === 'superadmin' || hasPermission(sess.userId, e.perm));
  };
  const entryOf = page => VQ_NAV.find(e => e.page === page);

  const vqFrame = document.getElementById('vqFrame');
  const vqHome = document.getElementById('vqHome');
  const vqTitle = document.getElementById('vqTitle');
  const vqBack = document.getElementById('vqBack');

  // ── Navigation interne : la page s'ouvre dans le panneau ──
  function showHome() {
    vqFrame.style.display = 'none';
    vqFrame.src = 'about:blank';
    vqHome.style.display = '';
    vqBack.classList.remove('on');
    vqTitle.textContent = 'Vie quotidienne';
    window.vqCurrentPage = null;
    sessionStorage.removeItem('vq_last_page');
    renderVqHome();
  }
  function loadPage(page, label) {
    vqHome.style.display = 'none';
    vqFrame.style.display = '';
    vqFrame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
    vqBack.classList.add('on');
    vqTitle.textContent = label || '';
    window.vqCurrentPage = page;
    sessionStorage.setItem('vq_last_page', page);
  }

  // Si une page chargée renvoie vers l'accueil ou la vie quotidienne, on sort de l'iframe
  vqFrame.addEventListener('load', () => {
    try {
      const f = vqFrame.contentWindow.location.pathname.split('/').pop();
      if (f === 'accueil.html') window.top.location.href = 'accueil.html';
      else if (f === 'vie-quotidienne.html') window.top.location.href = 'vie-quotidienne.html';
    } catch (e) { /* origine différente, on ignore */ }
  });

  // ── Mode d'emploi des modules (rôle · mode d'emploi · synchro · exemple) ──
  // Contenu conservé de la version précédente : il est désormais consultable
  // depuis le « ? » de chaque tuile d'accès rapide.
  const VQ_TUTO = {
    'journee.html': {
      role: "Le fil de la journée, quart par quart : chaque geste d'accompagnement prévu au projet personnalisé (🎯) se coche d'un tap, horodaté, avec le niveau de soutien apporté.",
      mode: [
        "Choisissez le quart en haut : « ☀️ Matin », « 🌤 Après-midi » ou « 🌙 Soir & nuit ».",
        "Repérez un résident dans le bandeau de pastilles (badge « n à faire ») ou faites défiler la liste.",
        "Touchez le grand cercle « ✓ » à gauche d'un moment pour le marquer fait ; re-touchez pour annuler.",
        "Après la coche, précisez le soutien apporté (Autonomie, Supervision, Aide partielle…).",
        "Si le moment n'a pas lieu, touchez « ⏭ Reporter » et choisissez un motif."
      ],
      sync: "Projet personnalisé (objectifs) · Tableau de bord éducateur (carte « Journée des référés » et répartition des niveaux de soutien).",
      ex:   "Ce matin, vous cochez « Préparer son petit-déjeuner » en « aide partielle » : la tâche passe en vert et le niveau remonte au tableau de bord."
    },
    'transmissions.html': {
      role: "Raconter l'essentiel d'un moment — ce qui a été observé, dit, fait — en une note courte reliée au résident, au fil de la journée.",
      mode: [
        "Parcourez le tableau du jour, réparti en colonnes « Matin », « Après-midi » et « Nuit ».",
        "Cliquez une carte floutée « Cliquer pour lire » pour l'afficher et la marquer comme lue.",
        "Pour écrire : « Nouvelle transmission », choisissez catégorie, résident et priorité, rédigez l'observation, puis « Enregistrer ».",
        "Sur une carte lue, répondez avec « 💬 » ou classez-la en « Journal » ou « Incident ».",
        "Ouvrez une journée passée via « 🗂 Jours précédents »."
      ],
      sync: "Fil de vie du tableau de bord · Fiche du résident · Niveau de soutien indiqué (répartition du tableau de bord).",
      ex:   "« Sieste agitée, s'est apaisé en musique » : la transmission apparaît aussitôt dans le fil de vie de ses référents."
    },
    'presences.html': {
      role: "Pointer qui est présent, absent ou sorti, jour par jour — la photographie de qui est là.",
      mode: [
        "Vérifiez la date en haut ; changez de jour avec « ← » « → », le champ date ou « Aujourd'hui ».",
        "Touchez la tuile d'un résident pour faire défiler son état : présent → absent → sortie → non pointé.",
        "Pour un motif, faites un appui long sur la tuile (ou « ✎ »), choisissez le statut, puis « Enregistrer ».",
        "Cliquez « ✓ Tous présents » pour pointer d'un coup ceux encore non pointés.",
        "« 📥 Export » : renseignez la période puis « 📥 Exporter PDF »."
      ],
      sync: "Planning / Semaine type : les absences récurrentes saisies s'y répercutent automatiquement.",
      ex:   "Vous notez M. B. « absent — hôpital » : l'absence apparaît sur son planning de la semaine."
    },
    'nuit.html': {
      role: "Le relais du veilleur : levers, observations et incidents de la nuit, consignés pour l'équipe de jour.",
      mode: [
        "Choisissez la nuit puis cliquez « 🌙 Ouvrir le cahier de cette nuit ».",
        "Ajustez l'« Effectif » présent et l'« Ambiance » (calme, agitée, très agitée).",
        "Pour chaque ronde : saisissez l'heure, cochez « RAS » ou ajoutez une observation, puis « + Ronde ».",
        "Signalez un incident avec « + Événement » ; notez un appel avec « + Appel astreinte ».",
        "Rédigez « Transmission pour l'équipe du matin » : elle s'enregistre toute seule."
      ],
      sync: "Relais nuit → équipe de jour · Fiche du résident.",
      ex:   "« Réveil à 3 h, a demandé un verre d'eau, s'est rendormi » : l'équipe du matin lit la nuit en un coup d'œil."
    },
    'repas.html': {
      role: "Le régime, la texture et les précautions alimentaires de chaque résident — la référence à table et en cuisine.",
      mode: [
        "Choisissez le jour (champ date, flèches ou frise) ; « Aujourd'hui » revient au jour même.",
        "Dans « 🍽 Menus du jour », saisissez « Menu 1 » et « Menu 2 » du midi et du soir.",
        "Tous sont inscrits par défaut : cliquez la case d'un repas pour retirer (ou réinscrire) un absent.",
        "Réglez le régime d'un présent via « 🍽 » puis « 💾 Enregistrer ».",
        "« 🖨 Feuille cuisine » imprime le récapitulatif pour la cuisine."
      ],
      sync: "Fiche du résident (données de santé) · Service des repas.",
      ex:   "M. R. : « texture mixée, sans porc » — l'information suit le résident à chaque service."
    },
    'activites.html': {
      role: "Les activités proposées et réalisées, reliées aux objectifs du projet — la vie sociale et les apprentissages.",
      mode: [
        "« Nouvelle activité » : renseignez nom, catégorie, jour, horaires, lieu et « Places maximum », puis « 💾 Enregistrer ».",
        "Filtrez avec « Toutes catégories » et « Tous les jours ».",
        "« 👥 Participants » : choisissez un résident puis « + Inscrire » (ou « ↩ Désinscrire »).",
        "« 📝 » : choisissez l'année, rédigez le bilan puis « 💾 Enregistrer le bilan ».",
        "Gérez la carte : « ⏸ Suspendre » / « ▶ Réactiver », « ✎ » modifier, « ✕ » supprimer."
      ],
      sync: "Projet personnalisé (objectifs) · Suivi du résident.",
      ex:   "Atelier cuisine du jeudi : vous notez la participation de Mme L., reliée à son objectif « gagner en autonomie »."
    },
    'medicaments.html': {
      role: "Le circuit du médicament : tracer chaque distribution — qui, quoi, quand — pour sécuriser la prise.",
      mode: [
        "La date du jour s'affiche en haut à droite par défaut.",
        "Choisissez le moment : « Matin », « Midi », « Soir » ou « Coucher ».",
        "Tapez la tuile d'un résident pour marquer « Donné » ; re-tapez pour annuler.",
        "Autre cas : « ✎ » (ou appui long) → « Confié », « Refusé », « Absent » ou « Reporté » + observation.",
        "Filtrez « Présents seulement » ou imprimez « 🖨 Feuille du jour »."
      ],
      sync: "Prescriptions · Fiche de santé · Traçabilité horodatée de la distribution.",
      ex:   "Distribution de 12 h validée pour M. T. : l'heure et l'intervenant sont enregistrés, la case ne peut plus être oubliée."
    },
    'plan-soins.html': {
      role: "Les soins récurrents planifiés (pansement, surveillance, hygiène) — le fil conducteur soignant.",
      mode: [
        "« Nouveau soin » (en haut à droite) ouvre la fiche.",
        "Choisissez le « Résident concerné », la « Catégorie » et la « Fréquence ».",
        "Saisissez le « Libellé du soin » (obligatoire), puis détail, intervenant et note.",
        "« Enregistrer » : le soin apparaît dans la frise du résident.",
        "Filtrez par résident/catégorie ; sur chaque soin : « ✎ » modifier, « ⏸ » suspendre, « ✕ » supprimer."
      ],
      sync: "Fiche de santé du résident · Équipe soignante.",
      ex:   "Réfection de pansement programmée tous les 2 jours : le plan rappelle l'échéance à l'équipe."
    }
  };

  // Le rendu vit dans js/vie-quotidienne-v2.js (maquette V2) : tous les
  // appelants historiques passent par ici.
  function renderVqHome() { if (typeof vq2Render === 'function') vq2Render(); }

  // Contrat avec le module de rendu V2
  window.VQ_NAV = VQ_NAV;
  window.VQ_TUTO = VQ_TUTO;
  window.VQ_GROUPS = GROUPS;
  window.vqAllowed = allowed;
  window.loadPage = loadPage;
  window.showHome = showHome;
  window.vqCurrentPage = null;

  // Reprend la rubrique affichée avant un rafraîchissement
  const lastPage = sessionStorage.getItem('vq_last_page');
  const lastEntry = lastPage && entryOf(lastPage);
  if (lastEntry && allowed(lastEntry)) loadPage(lastEntry.page, lastEntry.label);
</script>
<script src="js/vie-quotidienne-v2.js"></script>
<script>renderVqHome();</script>
</body></html>
