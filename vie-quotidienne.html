<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Vie quotidienne — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    html,body{margin:0;height:100%}
    .rh-layout{display:flex;height:calc(100vh - var(--header-h));overflow:hidden;background:transparent}
    .rh-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative;padding-bottom:88px}
    #vqFrame{flex:1;width:100%;border:none;background:#fff}

    /* ── Dock flottant ── */
    .rh-dock{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:60;
      display:flex;align-items:center;gap:5px;
      background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(12px);
      border-radius:17px;padding:6px 9px;
      border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(80,90,160,.18);
      max-width:calc(100vw - 24px);overflow-x:auto}
    .rh-dock::-webkit-scrollbar{height:0}
    .rh-dock-sep{width:1px;height:26px;flex-shrink:0;background:rgba(15,23,42,.1);margin:0 3px;align-self:center}
    .rh-dock-home{width:36px;height:36px;flex-shrink:0;border-radius:14px;border:none;
      background:rgba(15,23,42,.05);color:#64748b;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:background .15s,color .15s}
    .rh-dock-home:hover{background:rgba(15,23,42,.1);color:#334155}
    .rh-dock-home svg{width:17px;height:17px}
  </style>
</head>
<body>
<header class="header">
  <div class="header-info" style="display:flex;align-items:center;gap:.7rem">
    <div class="header-title" id="vqTitle">🏠 Vie quotidienne</div>
  </div>
  <div class="header-right"></div>
</header>

<div class="rh-layout">
  <div class="rh-main">
    <main class="content" id="vqHome" style="flex:1;overflow:auto;padding:1.75rem 1.5rem">
      <div style="max-width:640px;margin:0 auto">
        <div id="vqWelcome"></div>
      </div>
    </main>
    <iframe id="vqFrame" title="Contenu de la vie quotidienne" style="display:none"></iframe>
  </div>
</div>

<!-- Dock flottant (rempli par le script) -->
<nav class="rh-dock" id="vqDock" aria-label="Navigation vie quotidienne"></nav>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/portal-dock.js"></script>
<script>
  Auth.requireAuth();

  // ── Les 10 modules de la vie quotidienne (mêmes data-page, couleurs et icônes que l'ancienne barre) ──
  const VQ_NAV = [
    { g:'Suivi quotidien', page:'transmissions.html', label:'Transmissions', perm:'access_journal', c1:'#3b82f6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2v4l-4-4H9a1.994 1.994 0 0 1-1.414-.586m0 0L11 14h4a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2v4l.586-.586z"/></svg>' },
    { g:'Suivi quotidien', page:'presences.html', label:'Présences', perm:'access_presences', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' },
    { g:'Suivi quotidien', page:'nuit.html', label:'Cahier de nuit', perm:'access_journal', c1:'#312e81', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' },
    { g:'Cadre de vie', page:'repas.html', label:'Repas & régimes', perm:'view_residents', c1:'#ea580c', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>' },
    { g:'Soins', page:'medicaments.html', label:'Médicaments', perm:'access_medicaments', c1:'#dc2626', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 21 10a4.95 4.95 0 1 0-7-7L3.5 13.5a4.95 4.95 0 1 0 7 7z"/><path d="m8.5 8.5 7 7"/></svg>' },
    { g:'Soins', page:'plan-soins.html', label:'Plan de soins', perm:'view_residents', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-3-3v6"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>' }
  ];
  // Accès rapides du dock (dans l'ordre) + libellés courts
  const QUICK = ['transmissions.html', 'presences.html', 'medicaments.html'];
  const SHORT = { 'transmissions.html':'Transmis.', 'presences.html':'Présences', 'medicaments.html':'Médicam.', };
  const GROUPS = ['Suivi quotidien', 'Cadre de vie', 'Soins'];

  const sess = Auth.getSession();
  const allowed = e => {
    if (!e.perm) return true;
    return sess && (sess.role === 'admin' || sess.role === 'superadmin' || hasPermission(sess.userId, e.perm));
  };
  const entryOf = page => VQ_NAV.find(e => e.page === page);

  const vqFrame = document.getElementById('vqFrame');
  const vqHome = document.getElementById('vqHome');
  const vqTitle = document.getElementById('vqTitle');

  function setActive(page) {
    if (window.PortalDock) PortalDock.setActive(page);
  }

  // ── Navigation interne : la page s'ouvre dans le panneau ──
  function showHome() {
    vqFrame.style.display = 'none';
    vqFrame.src = 'about:blank';
    vqHome.style.display = '';
    setActive(null);
    vqTitle.textContent = '🏠 Vie quotidienne';
    sessionStorage.removeItem('vq_last_page');
  }
  function loadPage(page, label) {
    vqHome.style.display = 'none';
    vqFrame.style.display = '';
    vqFrame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
    setActive(page);
    vqTitle.textContent = label || '';
    sessionStorage.setItem('vq_last_page', page);
  }

  // ── Dock « par catégories » — 1 pastille par groupe + popover (composant partagé) ──
  const homeBtn = `<button class="rh-dock-home" id="vqHomeBtn" title="Accueil de la vie quotidienne" aria-label="Accueil de la vie quotidienne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>`;
  const GROUP_META = {
    'Suivi quotidien': { short: 'Suivi',        color: '#3b82f6', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="16" x2="13" y2="16"/></svg>' },
    'Cadre de vie':    { short: 'Cadre de vie', color: '#ea580c', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' },
    'Soins':           { short: 'Soins',        color: '#dc2626', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' }
  };
  const _vqLast = sessionStorage.getItem('vq_last_page');
  const _vqLastE = _vqLast && entryOf(_vqLast);
  PortalDock.init({
    dock: document.getElementById('vqDock'),
    nav: VQ_NAV, key: 'page', groups: GROUPS, groupMeta: GROUP_META,
    allowed, leading: homeBtn, onNavigate: e => loadPage(e.page, e.label),
    current: (_vqLastE && allowed(_vqLastE)) ? _vqLastE.page : null
  });

  // Bouton accueil du dock → showHome
  document.getElementById('vqHomeBtn').addEventListener('click', showHome);

  // Si une page chargée renvoie vers l'accueil ou la vie quotidienne, on sort de l'iframe
  vqFrame.addEventListener('load', () => {
    try {
      const f = vqFrame.contentWindow.location.pathname.split('/').pop();
      if (f === 'accueil.html') window.top.location.href = 'accueil.html';
      else if (f === 'vie-quotidienne.html') window.top.location.href = 'vie-quotidienne.html';
    } catch (e) { /* origine différente, on ignore */ }
  });

  // Reprend la rubrique affichée avant un rafraîchissement
  const lastPage = sessionStorage.getItem('vq_last_page');
  const lastEntry = lastPage && entryOf(lastPage);
  if (lastEntry && allowed(lastEntry)) loadPage(lastEntry.page, lastEntry.label);

  // ── Accueil de la rubrique ──
  (function () {
    const s = Auth.getSession();
    const el = document.getElementById('vqWelcome');
    if (!el) return;
    const prenom = (s && (s.prenom || s.username) || '').trim();
    el.innerHTML = `
      <div style="font-size:1.35rem;font-weight:800;color:var(--primary);letter-spacing:-.02em">🏠 Vie quotidienne</div>
      <div style="font-size:.86rem;color:var(--muted);margin-top:.25rem">${prenom ? 'Bonjour ' + escHtml(prenom) + ' — c' : 'C'}hoisissez une rubrique dans le dock en bas de l'écran — elle s'ouvre ici, sans quitter la page.</div>`;
  })();
</script>
</body></html>
