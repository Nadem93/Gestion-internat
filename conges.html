<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Demandes de congés — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-conges.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(245,158,11,.16)">

  <!-- ══ Barre supérieure ══════════════════════════════════════════ -->
  <div class="v2-top">
    <a class="v2-logo" href="pilotage.html" style="background:linear-gradient(135deg,#f59e0b,#fcd34d);color:#0a1728" title="Retour au portail RH">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · RH</div>
      <div class="v2-top-title">Demandes de congés</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <button type="button" class="v2-btn v2-btn-primary" onclick="openDemandeConge()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouvelle demande
      </button>
      <a href="pilotage.html" class="v2-btn">Portail</a>
    </div>
  </div>

  <!-- ══ Corps ═════════════════════════════════════════════════════ -->
  <div class="v2-body">

    <!-- KPI — tuiles « Console Data » à liseré gauche -->
    <div class="cgv-kpis">
      <div class="dc-kpi" style="--dc-c:#f59e0b">
        <div class="dc-kpi-top"><span class="dc-kpi-label">À valider</span><span class="dc-kpi-ico" style="color:#f59e0b"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg></span></div>
        <div class="dc-kpi-val" id="cgStatEnAttente" style="color:#f59e0b">0</div>
      </div>
      <div class="dc-kpi" style="--dc-c:#10b981">
        <div class="dc-kpi-top"><span class="dc-kpi-label">Acceptées</span><span class="dc-kpi-ico" style="color:#10b981"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></div>
        <div class="dc-kpi-val" id="cgStatAcceptes" style="color:#10b981">0</div>
      </div>
      <div class="dc-kpi" style="--dc-c:#ef4444">
        <div class="dc-kpi-top"><span class="dc-kpi-label">Refusées</span><span class="dc-kpi-ico" style="color:#ef4444"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></div>
        <div class="dc-kpi-val" id="cgStatRefuses" style="color:#ef4444">0</div>
      </div>
      <div class="dc-kpi" style="--dc-c:#22d3ee">
        <div class="dc-kpi-top"><span class="dc-kpi-label">Absents aujourd'hui</span><span class="dc-kpi-ico" style="color:#22d3ee"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg></span></div>
        <div class="dc-kpi-val" id="cgStatAbsents" style="color:#22d3ee">0</div>
      </div>
      <div class="dc-kpi" id="cgKpiConflit" style="--dc-c:#fb7185">
        <div class="dc-kpi-top"><span class="dc-kpi-label">Conflit d'effectif</span><span class="dc-kpi-ico" style="color:#fb7185"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span></div>
        <div class="dc-kpi-val" id="cgStatConflits" style="color:#fb7185">—</div>
      </div>
    </div>

    <!-- Onglets : À valider / Demandes traitées (rendus par js/conges-v2.js) -->
    <div class="cgv-tabs" id="cgTabs"></div>

    <!-- Filtres (affichés sur l'onglet « Demandes traitées ») -->
    <div class="v2-chips cgv-filters" id="cgFiltersRow">
      <div id="cgChips" class="v2-chips"></div>
      <!-- Contrat du JS de la page : la valeur de statut reste portée par ce <select>. -->
      <select id="cgFiltreStatut" onchange="renderConges()" hidden aria-hidden="true" tabindex="-1">
        <option value="">Tous</option>
        <option value="en_attente">En attente</option>
        <option value="accepte">Acceptés</option>
        <option value="refuse">Refusés</option>
      </select>
      <select id="cgFiltreEmploye" onchange="renderConges()" aria-label="Filtrer par salarié">
        <option value="">Tous les salariés</option>
      </select>
    </div>

    <!-- Liste + rail -->
    <div class="cgv-grid">
      <div class="cgv-main">

        <!-- Onglet « À valider » -->
        <div id="cgPendingCard" style="display:none">
          <div id="cgPendingList"></div>
        </div>

        <!-- Onglet « Demandes traitées » -->
        <div id="cgTraiteesCard">
          <div id="cgList" style="margin-top:12px"></div>
        </div>

      </div>
      <aside class="cgv-rail" id="cgRail"></aside>
    </div>

    <!-- Fonctionnalités : calendrier, compteurs, quotas, ordre, workflow -->
    <div class="cgv-features">
      <div class="dc-card" id="cgCalendrier"></div>

      <div class="cgv-b2">
        <div class="dc-card" id="cgCompteurs"></div>
        <div class="dc-card cgv-tint-rd" id="cgQuotas"></div>
      </div>

      <div class="cgv-b3">
        <div class="dc-card" id="cgOrdre"></div>
        <div class="dc-card" id="cgWorkflow"></div>
        <div class="dc-card cgv-tint-gr" id="cgAcquisition"></div>
      </div>
    </div>

  </div>
</div>

<!-- ══ MODALE — gabarit V2 de référence ══════════════════════════════ -->
<div class="v2-ov" id="modalConge">
  <div class="v2-md" style="--mc:#f59e0b;max-width:560px">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg>
      </span>
      <div style="min-width:0">
        <div class="v2-md-t" id="cgModalTitre">Nouvelle demande de congé</div>
        <div class="v2-md-s">Type, période et motif</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalConge')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l" for="cgEmploye">Salarié</label>
        <select id="cgEmploye" class="v2-fld" onchange="cgModalSync()"></select>
      </div>

      <div>
        <label class="v2-fld-l" for="cgType">Type</label>
        <div class="v2-seg" id="cgSeg" style="grid-auto-flow:row;grid-template-columns:repeat(3,1fr)">
          <button type="button" class="v2-seg-o on" data-t="cp"            onclick="CGV.pickType('cp')">Congés payés</button>
          <button type="button" class="v2-seg-o"    data-t="rtt"           onclick="CGV.pickType('rtt')">RTT</button>
          <button type="button" class="v2-seg-o"    data-t="maladie"       onclick="CGV.pickType('maladie')">Arrêt maladie</button>
          <button type="button" class="v2-seg-o"    data-t="enfant_malade" onclick="CGV.pickType('enfant_malade')">Enfant malade</button>
          <button type="button" class="v2-seg-o"    data-t="formation"     onclick="CGV.pickType('formation')">Formation</button>
          <button type="button" class="v2-seg-o"    data-t="autre"         onclick="CGV.pickType('autre')">Autre</button>
        </div>
        <!-- Contrat du JS de la page : la valeur reste portée par ce <select>. -->
        <select id="cgType" onchange="CGV.syncSeg();cgModalSync();CGV.syncDuree()" hidden aria-hidden="true" tabindex="-1">
          <option value="cp">Congés payés</option>
          <option value="rtt">RTT</option>
          <option value="maladie">Arrêt maladie</option>
          <option value="enfant_malade">Enfant malade</option>
          <option value="formation">Formation</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="cgDebut">Du</label>
          <input type="date" id="cgDebut" class="v2-fld" onchange="CGV.syncDuree()"/>
        </div>
        <div>
          <label class="v2-fld-l" for="cgFin">Au</label>
          <input type="date" id="cgFin" class="v2-fld" onchange="CGV.syncDuree()"/>
        </div>
      </div>

      <div>
        <label class="v2-fld-l" for="cgMotif">Motif</label>
        <textarea id="cgMotif" class="v2-fld" rows="2" placeholder="Raison de la demande…"></textarea>
      </div>

      <div id="cgDuree" class="v2-note v2-note-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Choisissez une date de début et de fin.</span>
      </div>
    </div>

    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalConge')">Annuler</button>
      <button type="button" class="v2-btn-pri" id="cgSaveBtn" onclick="saveConge(window._cgEditId || '')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="cgSaveLbl">Envoyer la demande</span>
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/conges-supabase.js"></script>
<script src="js/conges-card.js"></script>
<script src="js/conges.js"></script>
<script src="js/conges-v2.js?v=1"></script>
<script>Auth.requireAuth();</script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
