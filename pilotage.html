<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Portail — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-pilotage.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">

<div class="v2-shell pl-shell">

  <!-- Navigation latérale retirée : l'accès aux modules passe par les tuiles
       « Accès rapides » de l'accueil du portail (pl2Cards). Le code de rendu
       du rail et son repli mémorisé ont été supprimés avec lui. -->

  <!-- ── Panneau principal ── -->
  <div class="pl-main">
    <div class="pl-topbar">
      <a class="pl-back on" id="plAccueil" href="accueil.html" title="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 10v10h13V10"/></svg>
        Accueil
      </a>
      <button type="button" class="pl-back" id="plBack" onclick="showHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Portail
      </button>
      <div class="pl-topbar-t" id="plTitle">Portail</div>
      <!-- La cloche partagée (js/notif-bell.js) s'injecte dans .header-right -->
      <div class="header-right pl-bellbox"></div>
    </div>
    <div class="pl-scroll">
      <main class="v2-body" id="plHome"><div id="plWelcome"></div></main>
      <iframe id="plFrame" title="Contenu du portail" style="display:none"></iframe>
    </div>
  </div>

</div>

<!-- ── Mode d'emploi d'un module (gabarit de modale V2) ── -->
<div class="v2-ov" id="plTutoOv" role="dialog" aria-modal="true" aria-labelledby="plTutoT">
  <div class="v2-md" style="--mc:#6366f1">
    <div class="v2-md-h">
      <span class="v2-md-ico pl-md-ico" id="plTutoIco"></span>
      <div><div class="v2-md-t" id="plTutoT"></div><div class="v2-md-s" id="plTutoS"></div></div>
      <button class="v2-md-x" type="button" onclick="pl2CloseTuto()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="v2-md-b" id="plTutoB"></div>
    <div class="v2-md-f">
      <button class="v2-btn-sec" type="button" onclick="pl2CloseTuto()">Fermer</button>
      <button class="v2-btn-pri" type="button" onclick="pl2OuvrirTuto()">Ouvrir le module</button>
    </div>
  </div>
</div>

<!-- ── Droits annuels de congés (gabarit de modale V2) ── -->
<div class="v2-ov" id="plDroitsOv" role="dialog" aria-modal="true" aria-labelledby="plDroitsT">
  <div class="v2-md" style="--mc:#f59e0b">
    <div class="v2-md-h">
      <span class="v2-md-ico pl-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
      <div><div class="v2-md-t" id="plDroitsT">Droits annuels de congés</div>
        <div class="v2-md-s">Base de calcul des compteurs « Congés payés » et « RTT »</div></div>
      <button class="v2-md-x" type="button" onclick="pl2CloseDroits()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="v2-md-b">
      <div class="pl-dr-l" id="plDroitsList"></div>
      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="plDrEmp">Salarié</label>
          <select class="v2-fld" id="plDrEmp" onchange="pl2SyncDroits()"></select>
        </div>
        <div>
          <label class="v2-fld-l" for="plDrAnnee">Année</label>
          <input class="v2-fld" id="plDrAnnee" type="number" min="2000" max="2100" step="1" onchange="pl2SyncDroits()"/>
        </div>
      </div>
      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="plDrCp">Jours de congés payés</label>
          <input class="v2-fld" id="plDrCp" type="number" min="0" max="365" step="0.5" placeholder="25"/>
        </div>
        <div>
          <label class="v2-fld-l" for="plDrRtt">Jours de RTT</label>
          <input class="v2-fld" id="plDrRtt" type="number" min="0" max="365" step="0.5" placeholder="10"/>
        </div>
      </div>
      <div class="v2-note v2-note-ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        Sans droit annuel renseigné, les compteurs n'affichent que les jours pris : aucun solde n'est déduit.
      </div>
    </div>
    <div class="v2-md-f">
      <button class="v2-btn-sec" type="button" onclick="pl2CloseDroits()">Fermer</button>
      <button class="v2-btn-pri" type="button" id="plDrSave" onclick="pl2SaveDroits()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/profiles-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/conges-supabase.js"></script>
<script src="js/formations-supabase.js"></script>
<script src="js/fiches-paie-supabase.js"></script>
<script src="js/planning-equipe-supabase.js"></script>
<script src="js/entretiens-supabase.js"></script>
<script src="js/documents-employe-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/portal-tuto-data.js"></script>
<script>
  Auth.requireAuth();

  // ── Les modules du portail (mêmes data-page, permissions, couleurs 1re teinte
  //    et icônes que l'ancienne barre) ──
  const PL_NAV = [
    { g:'Mon espace personnel', page:'mes-absences.html', label:'Mes absences', c1:'#ef4444', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' },
    { g:'Mon espace personnel', page:'mes-conges.html', label:'Mes congés', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
    { g:'Mon espace personnel', page:'mes-formations.html', label:'Mes formations', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' },
    { g:'Mon espace personnel', page:'mes-fiches-paie.html', label:'Mes fiches de paie', c1:'#1e3a5f', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>' },
    { g:'Équipe & échanges', page:'planning-equipe.html', label:'Planning équipe', perm:'access_planning_equipe', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></svg>' },
    { g:'Équipe & échanges', page:'messages.html', module:'messages', label:'Messages', perm:'access_messages', c1:'#0284c7', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>' },
    { g:'Équipe & échanges', page:'notes.html', label:'Notes', perm:'access_notes', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' },
    { g:'Équipe & échanges', page:'documentation.html', label:'Documentation', perm:'access_documentation', c1:'#8b5cf6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' },
    { g:'Pilotage & ressources', page:'budget.html', label:'Budget & dépenses', perm:'access_budget', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.2 7a6 7 0 1 0 0 10"/><path d="M13 10h-8m0 4h8"/></svg>' },
    { g:'Pilotage & ressources', page:'facturation.html', label:'Facturation', perm:'access_facturation', c1:'#be185d', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
    { g:'Pilotage & ressources', page:'rapport.html', label:"Rapport d'activité", perm:'view_dashboard', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>' },
    { g:'Pilotage & ressources', page:'satisfaction.html', label:'Satisfaction résidents', perm:'view_residents', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' },
    { g:'Pilotage & ressources', page:'inventaire.html', label:'Inventaire & matériel', perm:'view_dashboard', c1:'#b45309', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>' }
  ];
  const PL_GROUPS = ['Mon espace personnel', 'Équipe & échanges', 'Pilotage & ressources'];

  // Masquage par permission : admin/superadmin voient tout ; sinon hasPermission
  const plAllowed = e => {
    if (!e.perm) return true;
    const s = Auth.getSession();
    return !!(s && (s.role === 'admin' || s.role === 'superadmin' || hasPermission(s.userId, e.perm)));
  };
  const entryOf = page => PL_NAV.find(e => e.page === page);

  // `const` au premier niveau d'un script classique ne crée PAS de propriété
  // sur window : le module de rendu (js/pilotage-v2.js) lit ces valeurs via
  // window, on les y publie explicitement.
  window.PL_NAV = PL_NAV;
  window.PL_GROUPS = PL_GROUPS;
  window.plAllowed = plAllowed;

  const plFrame = document.getElementById('plFrame');
  const plHome = document.getElementById('plHome');
  const plTitle = document.getElementById('plTitle');
  const plBack = document.getElementById('plBack');

  // ── Navigation interne : la page s'ouvre dans le panneau ──
  function showHome() {
    plFrame.style.display = 'none';
    plFrame.src = 'about:blank';
    plHome.style.display = '';
    plBack.classList.remove('on');
    plTitle.textContent = 'Portail';
    window.plCurrentPage = null;
    sessionStorage.removeItem('pl_last_page');
    renderPlHome();
  }
  function loadPage(page, label) {
    plHome.style.display = 'none';
    plFrame.style.display = '';
    plFrame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
    plBack.classList.add('on');
    plTitle.textContent = label || '';
    window.plCurrentPage = page;
    sessionStorage.setItem('pl_last_page', page);
  }

  // Ancienne fonction de rendu de l'accueil : elle délègue au module V2,
  // pour que tous les appelants existants continuent de marcher.
  function renderPlHome() {
    if (typeof pl2Render === 'function') pl2Render();
  }

  window.loadPage = loadPage;
  window.showHome = showHome;
  window.plCurrentPage = null;

  // Si une page chargée navigue vers l'accueil ou le portail, on sort de l'iframe
  // (sinon on se retrouve avec un portail imbriqué dans le panneau).
  plFrame.addEventListener('load', () => {
    try {
      const f = plFrame.contentWindow.location.pathname.split('/').pop();
      if (f === 'accueil.html') window.top.location.href = 'accueil.html';
      else if (f === 'pilotage.html') window.top.location.href = 'pilotage.html';
    } catch (e) { /* origine différente, on ignore */ }
  });
</script>
<script src="js/pilotage-v2.js"></script>
<script>
  // Rendu de l'accueil, puis reprise éventuelle de la rubrique affichée
  // avant un rafraîchissement.
  renderPlHome();
  const _plLast = sessionStorage.getItem('pl_last_page');
  const _plLastE = _plLast && entryOf(_plLast);
  if (_plLastE && plAllowed(_plLastE)) loadPage(_plLastE.page, _plLastE.label);
</script>
</body></html>
