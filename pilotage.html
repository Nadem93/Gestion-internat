<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Portail — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    html,body{margin:0;height:100%}
    .rh-layout{display:flex;height:calc(100vh - var(--header-h));overflow:hidden;background:#d8f1ea}
    .rh-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
    #plFrame{flex:1;width:100%;border:none;background:#fff}

    /* ── Dock flottant ── */
    .rh-dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
      display:flex;align-items:center;gap:5px;
      background:rgba(15,43,74,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-radius:17px;padding:6px 9px;
      box-shadow:0 18px 44px rgba(15,43,74,.42),0 2px 8px rgba(0,0,0,.2);
      max-width:calc(100vw - 24px);overflow-x:auto}
    .rh-dock::-webkit-scrollbar{height:0}
    .rh-dock-home{width:36px;height:36px;flex-shrink:0;border-radius:13px;border:none;
      background:rgba(255,255,255,.1);color:#aebbd0;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:background .15s,color .15s}
    .rh-dock-home:hover{background:rgba(255,255,255,.2);color:#fff}
    .rh-dock-home svg{width:17px;height:17px}
    .rh-dock-sep{width:1px;height:34px;background:rgba(255,255,255,.16);flex-shrink:0}
    .rh-dock-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;flex-shrink:0;
      padding:5px 3px;border-radius:12px;border:none;background:none;color:#aebbd0;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
    .rh-dock-item:hover{background:rgba(255,255,255,.08);color:#fff}
    .rh-dock-item.active{background:rgba(255,255,255,.16);color:#fff}
    .rh-dock-item svg{width:18px;height:18px;display:block}
    .rh-dock-item .lbl{font-size:.55rem;font-weight:600;white-space:nowrap}
    .rh-dock-item{position:relative}
    .rh-dock-grid{width:42px;height:42px;flex-shrink:0;border-radius:16px;border:none;
      background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;
      cursor:pointer;box-shadow:0 5px 13px rgba(79,70,229,.5);transition:transform .15s,box-shadow .15s}
    .rh-dock-grid:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.6)}
    .rh-dock-grid svg{width:19px;height:19px}

    /* ── Popover « Tous les modules » ── */
    .rh-pop-overlay{position:fixed;inset:0;z-index:59;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none}
    .rh-pop-overlay.open{display:block}
    .rh-pop{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:61;
      background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(15,43,74,.3);
      padding:20px 22px;max-width:calc(100vw - 28px);max-height:calc(100vh - 160px);overflow:auto;display:none}
    .rh-pop.open{display:block}
    .rh-pop-title{font-size:.9rem;font-weight:800;color:#0f2b4a;margin-bottom:14px}
    .rh-pop-grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:20px}
    .rh-pop-col-title{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:8px}
    .rh-pop-link{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;border:none;background:none;
      width:100%;text-align:left;font-family:inherit;font-size:.8rem;font-weight:500;color:#334155;cursor:pointer;transition:background .12s}
    .rh-pop-link:hover{background:#f1f5f9}
    .rh-pop-link.active{background:#eef2ff;color:#4f46e5;font-weight:700}
    .rh-pop-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
    .rh-pop-link{position:relative}
    @media(max-width:900px){.rh-pop-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.rh-pop-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="header">
  <div class="header-info" style="display:flex;align-items:center;gap:.7rem">
    <div class="header-title" id="plTitle">Portail</div>
  </div>
  <div class="header-right"></div>
</header>

<div class="rh-layout">
  <div class="rh-main">
    <main class="content" id="plHome" style="flex:1;overflow:auto;padding:1.75rem 1.5rem">
      <div style="max-width:640px;margin:0 auto">
        <div id="plWelcome" style="margin-bottom:1.5rem"></div>
        <div id="mesDocsSection"></div>
      </div>
    </main>
    <iframe id="plFrame" title="Contenu du portail" style="display:none"></iframe>
  </div>
</div>

<!-- Dock flottant + popover (remplis par le script) -->
<div class="rh-pop-overlay" id="rhPopOverlay"></div>
<div class="rh-pop" id="rhPop" role="dialog" aria-label="Tous les modules du portail"></div>
<nav class="rh-dock" id="rhDock" aria-label="Navigation du portail"></nav>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/documents-employe-supabase.js"></script>
<script src="js/messages-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/ppe-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/notif-bell.js"></script>
<script>
  Auth.requireAuth();

  // ── Les modules du portail (mêmes data-page, couleurs 1re teinte et icônes que l'ancienne barre) ──
  const PL_NAV = [
    { g:'Mon espace personnel', page:'mes-absences.html', label:'Mes absences', c1:'#ef4444', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' },
    { g:'Mon espace personnel', page:'mes-conges.html', label:'Mes congés', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' },
    { g:'Mon espace personnel', page:'mes-formations.html', label:'Mes formations', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>' },
    { g:'Mon espace personnel', page:'mes-fiches-paie.html', label:'Mes fiches de paie', c1:'#1e3a5f', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>' },
    { g:'Équipe & échanges', page:'planning-equipe.html', label:'Planning équipe', perm:'access_planning_equipe', c1:'#0891b2', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></svg>' },
    { g:'Équipe & échanges', page:'messages.html', module:'messages', label:'Messages', perm:'access_messages', c1:'#0284c7', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>' },
    { g:'Équipe & échanges', page:'notes.html', label:'Notes', perm:'access_notes', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' },
    { g:'Équipe & échanges', page:'documentation.html', label:'Documentation', perm:'access_documentation', c1:'#8b5cf6', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' },
    { g:'Pilotage & ressources', page:'budget.html', label:'Budget & dépenses', perm:'access_budget', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.2 7a6 7 0 1 0 0 10"/><path d="M13 10h-8m0 4h8"/></svg>' },
    { g:'Pilotage & ressources', page:'facturation.html', label:'Facturation', perm:'access_facturation', c1:'#be185d', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
    { g:'Pilotage & ressources', page:'rapport.html', label:"Rapport d'activité", perm:'view_dashboard', c1:'#16a34a', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>' },
    { g:'Pilotage & ressources', page:'satisfaction.html', label:'Satisfaction résidents', perm:'view_residents', c1:'#f59e0b', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' },
    { g:'Pilotage & ressources', page:'inventaire.html', label:'Inventaire & matériel', perm:'view_dashboard', c1:'#b45309', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>' }
  ];
  // Accès rapides du dock (les 5 modules les plus utilisés) + libellés courts
  const QUICK = ['mes-absences.html', 'mes-conges.html', 'planning-equipe.html', 'messages.html', 'mes-fiches-paie.html'];
  const SHORT = { 'mes-absences.html':'Absences', 'mes-conges.html':'Congés', 'planning-equipe.html':'Planning', 'messages.html':'Messages', 'mes-fiches-paie.html':'Paie' };
  const GROUPS = ['Mon espace personnel', 'Équipe & échanges', 'Pilotage & ressources'];

  const allowed = e => {
    if (!e.perm) return true;
    const s = Auth.getSession();
    return !!(s && (s.role === 'admin' || s.role === 'superadmin' || hasPermission(s.userId, e.perm)));
  };
  const entryOf = page => PL_NAV.find(e => e.page === page);

  const plFrame = document.getElementById('plFrame');
  const plHome = document.getElementById('plHome');
  const plTitle = document.getElementById('plTitle');
  const pop = document.getElementById('rhPop');
  const overlay = document.getElementById('rhPopOverlay');

  function closePop() { pop.classList.remove('open'); overlay.classList.remove('open'); }
  function openPop() { pop.classList.add('open'); overlay.classList.add('open'); }
  function setActive(page) {
    document.querySelectorAll('.rh-dock-item').forEach(d => d.classList.toggle('active', d.dataset.page === page));
    document.querySelectorAll('.rh-pop-link').forEach(d => d.classList.toggle('active', d.dataset.page === page));
  }

  // ── Navigation interne : la page s'ouvre dans le panneau, le dock reste visible ──
  function showHome() {
    plFrame.style.display = 'none';
    plFrame.src = 'about:blank';
    plHome.style.display = '';
    plTitle.textContent = 'Portail';
    setActive(null);
    sessionStorage.removeItem('pl_last_page');
    closePop();
  }
  function loadPage(page, label) {
    plHome.style.display = 'none';
    plFrame.style.display = '';
    plFrame.src = page + (page.includes('?') ? '&' : '?') + 'embed=1';
    plTitle.textContent = label || '';
    setActive(page);
    sessionStorage.setItem('pl_last_page', page);
    closePop();
  }

  // ── Dock : petit bouton accueil · 2 accès rapides · bouton central grille · 2 accès rapides ──
  const dockItem = page => {
    const e = entryOf(page);
    if (!e || !allowed(e)) return '';
    const attrs = e.module ? ` data-module="${e.module}"` : '';
    return `<button class="rh-dock-item" data-page="${e.page}"${attrs} title="${e.label}"><span style="display:flex">${e.icon}</span><span class="lbl">${SHORT[page] || e.label}</span></button>`;
  };
  const homeBtn = `<button class="rh-dock-home" id="plHomeBtn" title="Accueil du portail" aria-label="Accueil du portail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>`;
  const gridBtn = `<button class="rh-dock-grid" id="rhGridBtn" title="Tous les modules du portail" aria-label="Tous les modules du portail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>`;
  document.getElementById('rhDock').innerHTML =
    homeBtn + `<span class="rh-dock-sep"></span>` +
    dockItem(QUICK[0]) + dockItem(QUICK[1]) + gridBtn + dockItem(QUICK[2]) + dockItem(QUICK[3]) + dockItem(QUICK[4]);

  // ── Popover : 3 colonnes = 3 groupes, entrées autorisées uniquement ──
  pop.innerHTML = `<div class="rh-pop-title">Tous les modules du portail</div><div class="rh-pop-grid">${
    GROUPS.map(g => `<div><div class="rh-pop-col-title">${g}</div>${
      PL_NAV.filter(e => e.g === g && allowed(e)).map(e => {
        const attrs = e.module ? ` data-module="${e.module}"` : '';
        return `<button class="rh-pop-link" data-page="${e.page}"${attrs}><span class="rh-pop-dot" style="background:${e.c1}"></span>${e.label}</button>`;
      }).join('')
    }</div>`).join('')
  }</div>`;

  // Clics (dock + popover) → loadPage
  document.querySelectorAll('.rh-dock-item, .rh-pop-link').forEach(b => {
    b.addEventListener('click', () => { const e = entryOf(b.dataset.page); loadPage(b.dataset.page, e ? e.label : ''); });
  });
  // Bouton accueil : revient à l'accueil du portail
  document.getElementById('plHomeBtn').addEventListener('click', showHome);
  // Bouton central : ouvre/ferme le popover ; overlay : ferme
  document.getElementById('rhGridBtn').addEventListener('click', () => pop.classList.contains('open') ? closePop() : openPop());
  overlay.addEventListener('click', closePop);

  // Si une page chargée navigue vers l'accueil ou le portail, on sort de l'iframe
  // (sinon on se retrouve avec un portail imbriqué dans le panneau).
  plFrame.addEventListener('load', () => {
    try {
      const f = plFrame.contentWindow.location.pathname.split('/').pop();
      if (f === 'accueil.html') window.top.location.href = 'accueil.html';
      else if (f === 'pilotage.html') window.top.location.href = 'pilotage.html';
    } catch (e) { /* origine différente, on ignore */ }
  });

  // Reprend la rubrique affichée avant un rafraîchissement
  const lastPage = sessionStorage.getItem('pl_last_page');
  const lastEntry = lastPage && entryOf(lastPage);
  if (lastEntry && allowed(lastEntry)) loadPage(lastEntry.page, lastEntry.label);

  // ── Accueil personnalisé ──
  (function () {
    const s = Auth.getSession();
    const el = document.getElementById('plWelcome');
    if (!s || !el) return;
    const prenom = (s.prenom || s.username || '').trim();
    el.innerHTML = `
      <div style="font-size:1.35rem;font-weight:800;color:var(--primary);letter-spacing:-.02em">Bonjour${prenom ? ' ' + escHtml(prenom) : ''} 👋</div>
      <div style="font-size:.86rem;color:var(--muted);margin-top:.25rem">Choisissez une rubrique dans le dock en bas de l'écran — elle s'ouvre ici, sans quitter le portail.</div>`;
  })();

  // ── Badge messages non lus (sur l'icône de la rubrique) — source Supabase ──
  function _plRenderMsgBadge(unread) {
    document.querySelectorAll('[data-module="messages"]').forEach(el => {
      const host = el.querySelector('span') || el;
      let badge = host.querySelector('.notif-badge');
      if (unread > 0) {
        if (!badge) { badge = document.createElement('span'); badge.className = 'notif-badge'; host.appendChild(badge); }
        badge.textContent = unread > 99 ? '99+' : unread;
        badge.classList.remove('hidden');
      } else if (badge) {
        badge.remove();
      }
    });
  }
  async function updatePilotageNotifs() {
    const session = Auth.getSession();
    if (!session || typeof sbGetMessages !== 'function') return;
    const uid = String(session.userId);
    try {
      const [messages, convs] = await Promise.all([sbGetMessages(), sbGetConversations()]);
      const myConvIds = Object.values(convs).filter(c => (c.userIds || []).map(String).includes(uid)).map(c => c.id);
      const unread = messages.filter(m => myConvIds.includes(m.convId) && !(m.readBy || []).map(String).includes(uid) && String(m.from) !== uid).length;
      _plRenderMsgBadge(unread);
    } catch (e) { console.error('[updatePilotageNotifs]', e); }
  }
  document.addEventListener('DOMContentLoaded', updatePilotageNotifs);
  window.addEventListener('focus', updatePilotageNotifs);
  setInterval(updatePilotageNotifs, 30000);

  // ── Mes documents transmis ──
  (async function renderMesDocs() {
    const session = Auth.getSession();
    if (!session) return;
    const DOC_CAT = { contrat:'Contrat', fiche:'Fiche de poste', administratif:'Administratif', formation:'Formation', sanction:'Sanction', autre:'Autre' };
    function fmtSize(b) {
      if (!b) return '';
      if (b < 1024) return b + ' o';
      if (b < 1024*1024) return Math.round(b/1024) + ' Ko';
      return (b/1024/1024).toFixed(1) + ' Mo';
    }
    try {
      const employes = await sbGetEmployes();
      const fiche = employes.find(e => String(e.profileId) === String(session.userId));
      if (!fiche) return;
      const docs = await sbGetDocsEmploye(fiche.id);
      if (!docs.length) return;
      window._mesDocs = docs;
      const docRows = docs.map(d => `
        <div style="display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;border-bottom:1px solid var(--border)">
          <span style="font-size:1.2rem">📎</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(d.name)}</div>
            <div style="font-size:.72rem;color:var(--muted)">${DOC_CAT[d.category]||d.category||'—'}${d.docDate?' · '+new Date(d.docDate).toLocaleDateString('fr-FR'):''} · ${fmtSize(d.size)}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="mesDocsDownload('${d.id}')">↓</button>
        </div>`).join('');
      document.getElementById('mesDocsSection').innerHTML = `
        <div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.75rem">Mes documents</div>
        <div class="card">
          <div class="card-header"><span class="card-title">📎 Documents transmis</span></div>
          <div class="card-body" style="padding:0">${docRows}</div>
        </div>`;
    } catch (e) { console.error('[renderMesDocs]', e); }
  })();

  async function mesDocsDownload(id) {
    const d = (window._mesDocs || []).find(x => x.id === id);
    if (!d || !d.fichierPath) return;
    const url = await sbJustificatifUrl(d.fichierPath);
    if (url) window.open(url, '_blank'); else toast('Document introuvable', 'error');
  }
</script>
</body></html>
