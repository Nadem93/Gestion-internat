<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><link rel="apple-touch-icon" href="icon-192.png"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tableau de bord — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
</head>
<body class="v2">

<div class="v2-shell">

  <!-- TOP BAR -->
  <div class="v2-top">
    <a class="v2-logo" href="accueil.html" title="Accueil">I</a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Centre de pilotage</div>
      <div class="v2-top-title" id="dv2Etab">Établissement</div>
    </div>
    <div class="v2-sys"><span class="v2-sys-dot"></span><span id="dv2Sync">Système à jour</span></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <label class="v2-search" style="cursor:text">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="dv2Search" type="search" placeholder="Rechercher un résident, une action…"
               style="flex:1;background:none;border:none;outline:none;color:var(--v2-t2);font-family:inherit;font-size:13.5px;padding:0"/>
        <span class="v2-kbd">⌘K</span>
      </label>
      <a class="v2-btn v2-btn-ico" href="messages.html" title="Messages">✉</a>
      <a class="v2-btn v2-btn-ico" href="alertes.html" title="Alertes">🔔</a>
      <a href="employe.html" title="Mon profil" style="display:flex;align-items:center;gap:9px;text-decoration:none">
        <span id="dv2UserName" style="font-size:12.5px;font-weight:600;color:var(--v2-t4)"></span>
        <span class="v2-av" id="dv2UserAv" style="background:linear-gradient(135deg,#818cf8,#22d3ee)">·</span>
      </a>
    </div>
  </div>

  <!-- CONTENU : entièrement rendu par js/dashboard-v2.js -->
  <div class="v2-body"><div id="dashV2"></div></div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
<script>Auth.requireAuth();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/config-supabase.js"></script>
<script src="js/journal-supabase.js"></script>
<script src="js/planning-supabase.js"></script>
<script src="js/transmissions-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/conges-supabase.js"></script>
<script src="js/planning-equipe-supabase.js"></script>
<script src="js/formations-supabase.js"></script>
<script src="js/presences-supabase.js"></script>
<script src="js/echeances-supabase.js"></script>
<script src="js/satisfaction-supabase.js"></script>
<script src="js/incidents-supabase.js"></script>
<script src="js/activites-supabase.js"></script>
<script src="js/inventaire-supabase.js"></script>
<script src="js/interventions-supabase.js"></script>
<script src="js/chambres-supabase.js"></script>
<script src="js/medicaments-supabase.js"></script>
<script src="js/budget-supabase.js"></script>
<script src="js/dashboard-v2-supabase.js"></script>
<script src="js/dashboard-v2.js"></script>

<script>
  // En-tête : établissement + utilisateur connecté
  (function () {
    const s = Auth.getSession() || {};
    const nom = [s.prenom, s.nom].filter(Boolean).join(' ') || s.username || '';
    document.getElementById('dv2UserName').textContent = nom;
    document.getElementById('dv2UserAv').textContent =
      ((s.prenom || '')[0] || '') + ((s.nom || '')[0] || '') || (s.username || '?')[0].toUpperCase();
    try {
      const e = (typeof getCurrentEtab === 'function') ? getCurrentEtab() : null;
      if (e && e.nom) document.getElementById('dv2Etab').textContent = e.nom;
    } catch (_) {}
  })();

  // Recherche globale : ⌘K / Ctrl+K place le focus, Entrée ouvre les résidents filtrés
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); document.getElementById('dv2Search').focus();
    }
  });
  document.getElementById('dv2Search').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (q) location.href = 'residents.html?q=' + encodeURIComponent(q);
    }
  });

  // Chargement du cockpit
  (async () => {
    try { await sbLoadResidentsCache(); } catch (e) { console.error(e); }
    try { await initDashboardV2(); } catch (e) {
      console.error('[dashV2]', e);
      document.getElementById('dashV2').innerHTML =
        '<div class="v2-card" style="color:var(--v2-danger-text)">Erreur de chargement du tableau de bord : ' + (e?.message || e) + '</div>';
    }
    const sync = document.getElementById('dv2Sync');
    if (sync) sync.textContent = 'Système à jour · ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  })();
</script>
</body>
</html>
