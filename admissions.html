<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admissions — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-admissions.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="app-layout"><div class="main">
  <div class="v2-shell ad2-shell">

    <!-- BARRE DU HAUT -->
    <div class="v2-top">
      <a class="v2-logo" href="dossiers.html" style="background:linear-gradient(135deg,#4f46e5,#818cf8)" aria-label="Dossiers &amp; suivi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      </a>
      <div style="line-height:1.15;min-width:0">
        <div class="v2-eyebrow">INTERNALIS · Dossiers &amp; suivi</div>
        <div class="v2-top-title">Admissions &amp; liste d'attente</div>
      </div>
      <div class="ad2-top-act">
        <input type="search" id="admSearch" class="ad2-search" placeholder="Rechercher un candidat…" oninput="renderAdmissions()"/>
        <button type="button" class="ad2-new admin-only" onclick="openAdmissionModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle demande
        </button>
      </div>
    </div>

    <div class="v2-body">

      <!-- STATISTIQUES -->
      <div class="ad2-stats">
        <div class="ad2-stat" style="--sc:#f59e0b">
          <span class="ad2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg></span>
          <div><div class="ad2-stat-n" id="admStatEnAttente">0</div><div class="ad2-stat-l">En attente</div></div>
        </div>
        <div class="ad2-stat" style="--sc:#0ea5e9">
          <span class="ad2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
          <div><div class="ad2-stat-n" id="admStatEtude">0</div><div class="ad2-stat-l">En étude</div></div>
        </div>
        <div class="ad2-stat" style="--sc:#10b981">
          <span class="ad2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <div><div class="ad2-stat-n" id="admStatAdmis">0</div><div class="ad2-stat-l">Admis</div></div>
        </div>
        <div class="ad2-stat" style="--sc:#818cf8">
          <span class="ad2-stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></span>
          <div><div class="ad2-stat-n" id="admStatTotal">0</div><div class="ad2-stat-l">Total demandes</div></div>
        </div>
      </div>

      <!-- TABLEAU DES DEMANDES (4 colonnes) -->
      <div id="admList" class="ad2-board"></div>

    </div>
  </div>
</div></div>

<!-- MODALE DEMANDE D'ADMISSION -->
<div class="v2-ov" id="modalAdmission">
  <div class="v2-md" style="--mc:#818cf8">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
      <div><div class="v2-md-t" id="admModalTitle">Nouvelle demande d'admission</div><div class="v2-md-s">Candidat et orientation</div></div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalAdmission')" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <div class="v2-grid2">
        <div><label class="v2-fld-l" for="admFormPrenom">Prénom du candidat *</label><input type="text" id="admFormPrenom" class="v2-fld" placeholder="Ex : Lucas"/></div>
        <div><label class="v2-fld-l" for="admFormNom">Nom du candidat *</label><input type="text" id="admFormNom" class="v2-fld" placeholder="Ex : Meyer"/></div>
      </div>
      <div class="v2-grid2">
        <div><label class="v2-fld-l" for="admFormDateNaissance">Date de naissance</label><input type="date" id="admFormDateNaissance" class="v2-fld"/></div>
        <div><label class="v2-fld-l" for="admFormDateDemande">Date de la demande</label><input type="date" id="admFormDateDemande" class="v2-fld"/></div>
      </div>
      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="admFormOrigine">Orientation</label>
          <select id="admFormOrigine" class="v2-fld">
            <option value="MDPH">MDPH — notification</option>
            <option value="ASE">ASE</option>
            <option value="Famille">Famille / demande directe</option>
            <option value="Établissement">Établissement (réorientation)</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div><label class="v2-fld-l" for="admFormDossier">Numéro de dossier MDPH</label><input type="text" id="admFormDossier" class="v2-fld" placeholder="Ex : 75-2024-01288"/></div>
      </div>
      <div>
        <span class="v2-fld-l">Étape</span>
        <div class="v2-seg" id="admSeg">
          <button type="button" class="v2-seg-o" data-statut="en_attente" onclick="adm2SetStatut('en_attente')">En attente</button>
          <button type="button" class="v2-seg-o" data-statut="etude" onclick="adm2SetStatut('etude')">En étude</button>
          <button type="button" class="v2-seg-o" data-statut="admis" onclick="adm2SetStatut('admis')">Admis</button>
          <button type="button" class="v2-seg-o" data-statut="refuse" onclick="adm2SetStatut('refuse')">Refusé</button>
          <button type="button" class="v2-seg-o" data-statut="abandon" onclick="adm2SetStatut('abandon')">Désistement</button>
        </div>
        <select id="admFormStatut" hidden aria-hidden="true" tabindex="-1">
          <option value="en_attente">En attente</option>
          <option value="etude">En étude</option>
          <option value="admis">Admis</option>
          <option value="refuse">Refusé</option>
          <option value="abandon">Désistement</option>
        </select>
      </div>
      <div class="v2-grid2">
        <div><label class="v2-fld-l" for="admFormDateEntree">Date d'entrée prévue</label><input type="date" id="admFormDateEntree" class="v2-fld"/></div>
        <div><label class="v2-fld-l" for="admFormContactNom">Contact (famille / référent)</label><input type="text" id="admFormContactNom" class="v2-fld" placeholder="Nom du contact"/></div>
      </div>
      <div class="v2-grid2">
        <div><label class="v2-fld-l" for="admFormContactTel">Téléphone du contact</label><input type="text" id="admFormContactTel" class="v2-fld" placeholder="06 12 34 56 78"/></div>
        <div></div>
      </div>
      <div>
        <label class="v2-fld-l" for="admFormNotes">Notes / motif de la demande</label>
        <textarea id="admFormNotes" class="v2-fld" rows="3" placeholder="Éléments du dossier, urgence, particularités…"></textarea>
      </div>
      <div class="v2-note v2-note-ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Le bouton « Admettre » d'une carte crée la fiche résident et bascule la demande en « Admis ».
      </div>
    </div>
    <div class="v2-md-f">
      <button type="button" class="ad2-del" id="admDeleteBtn" style="display:none" onclick="supprimerAdmission()">Supprimer</button>
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalAdmission')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="saveAdmission()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/admissions-supabase.js"></script>
<script src="js/admissions.js"></script>
<script src="js/admissions-v2.js"></script>
<script>Auth.requireAuth(); if (!requireModule('access_admissions')) { document.querySelector('.v2-body').innerHTML = ''; }</script>
</body></html>
