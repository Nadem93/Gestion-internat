<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Véhicules — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-vehicules.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(79,70,229,.24)">

  <!-- ── Barre du haut ─────────────────────────────────────────────── -->
  <div class="v2-top">
    <a class="v2-logo" href="accueil.html" style="background:linear-gradient(135deg,#4f46e5,#818cf8)" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><rect x="2" y="7" width="20" height="12" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Logistique</div>
      <div class="v2-top-title">Véhicules du foyer</div>
    </div>
    <div class="vh-top-actions">
      <a href="dashboard.html" class="v2-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Tableau de bord
      </a>
      <button type="button" class="v2-btn v2-btn-primary" onclick="openReservationModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouvelle réservation
      </button>
    </div>
  </div>

  <!-- ── Contenu ───────────────────────────────────────────────────── -->
  <div class="v2-body">

    <!-- Tuiles KPI -->
    <div class="vh-kpis" id="vhKpis"></div>

    <!-- Filtres par véhicule -->
    <div class="vh-filters">
      <div class="v2-chips" id="vhChips"></div>
      <span class="vh-count" id="vhCount"></span>
    </div>

    <div class="vh-main">
      <!-- Colonne principale -->
      <div class="vh-col">
        <div class="v2-blk">
          <div class="v2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" style="width:16px;height:16px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="v2-blk-t">Réservations à venir</span>
          </div>
          <div id="vReservationsList">
            <div class="v2-blk-vide">Aucune réservation à venir.</div>
          </div>
        </div>

        <!-- Historique — réservé aux administrateurs -->
        <div class="v2-blk admin-only" id="pastReservationsCard">
          <div class="v2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" style="width:16px;height:16px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="v2-blk-t">Historique</span>
            <span class="v2-blk-lien" id="vhPastCount" style="color:var(--v2-t7);font-weight:500"></span>
          </div>
          <div id="vPastReservationsList">
            <div class="v2-blk-vide">Aucune réservation passée.</div>
          </div>
        </div>
      </div>

      <!-- Rail -->
      <div class="vh-rail">
        <div class="v2-blk v2-rail-blk">
          <div class="v2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" style="width:16px;height:16px"><rect x="2" y="7" width="20" height="12" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg>
            <span class="v2-blk-t">Parc de véhicules</span>
          </div>
          <div id="vhParc"></div>
        </div>

        <div class="v2-blk v2-rail-blk">
          <div class="v2-blk-h">
            <svg viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" style="width:16px;height:16px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span class="v2-blk-t">Charge des 7 prochains jours</span>
          </div>
          <div id="vhCharge"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Modale : nouvelle réservation (gabarit .v2-ov/.v2-md) ─────────── -->
<div class="v2-ov" id="modalReservation">
  <div class="v2-md" style="--mc:#6366f1">
    <div class="v2-md-h">
      <span class="v2-md-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="12" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg>
      </span>
      <div>
        <div class="v2-md-t">Nouvelle réservation</div>
        <div class="v2-md-s">Réserver un véhicule du foyer sur un créneau</div>
      </div>
      <button type="button" class="v2-md-x" aria-label="Fermer" onclick="closeModal('modalReservation')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="v2-md-b">
      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="vDateAller">Date &amp; heure de départ</label>
          <input class="v2-fld" type="datetime-local" id="vDateAller"/>
        </div>
        <div>
          <label class="v2-fld-l" for="vDuree">Durée</label>
          <select class="v2-fld" id="vDuree">
            <option value="30">30 min</option>
            <option value="60" selected>1 h</option>
            <option value="90">1 h 30</option>
            <option value="120">2 h</option>
            <option value="180">3 h</option>
            <option value="240">4 h</option>
            <option value="360">6 h</option>
            <option value="480">8 h</option>
            <option value="journee">Journée</option>
          </select>
        </div>
      </div>

      <div>
        <label class="v2-fld-l" for="vVehicule">Véhicule</label>
        <input class="v2-fld" type="text" id="vVehicule" list="vehiculesList" placeholder="Sélectionner ou saisir un véhicule"/>
        <datalist id="vehiculesList"></datalist>
      </div>

      <div>
        <label class="v2-fld-l" for="vDestination">Destination</label>
        <input class="v2-fld" type="text" id="vDestination" placeholder="Lieu de destination"/>
      </div>

      <div>
        <label class="v2-fld-l" for="vMotif">Motif</label>
        <input class="v2-fld" type="text" id="vMotif" placeholder="Objet du déplacement (optionnel)"/>
      </div>

      <div class="v2-note v2-note-ok" id="vReservataire"></div>
    </div>

    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalReservation')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="reserverVehicule()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        Confirmer la réservation
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script>Auth.requireAuth();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/config-supabase.js"></script>
<script src="js/planning-supabase.js"></script>
<script src="js/vehicules.js"></script>
<script src="js/vehicules-v2.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
