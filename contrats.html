<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#0a1728"/>
  <title>Contrats de travail — INTERNALIS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-contrats.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(8,145,178,.18)">

  <div class="v2-top">
    <a class="v2-logo" href="rh.html" style="background:linear-gradient(135deg,#0891b2,#22d3ee)" title="Retour au portail RH">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · RH</div>
      <div class="v2-top-title">Contrats de travail</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <a href="rh.html" class="v2-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Portail RH
      </a>
      <button type="button" id="btnAddContrat" class="v2-btn v2-btn-primary" onclick="openContratModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouveau contrat
      </button>
    </div>
  </div>

  <div class="v2-body">

    <!-- Tuiles statistiques -->
    <div id="ct2Stats" class="ct2-stats"></div>

    <!-- Filtres : chips de type (pilotent le <select> hérité) + employé/statut -->
    <div class="ct2-filters">
      <div id="ct2Chips" class="v2-chips"></div>
      <select id="ctFilterEmploye" class="ct2-sel ct2-filters-sp" aria-label="Filtrer par employé">
        <option value="">Tous les employés</option>
      </select>
      <select id="ctFilterStatut" class="ct2-sel" aria-label="Filtrer par statut">
        <option value="">Tous statuts</option>
        <option value="actif">Actif</option>
        <option value="termine">Terminé</option>
      </select>
      <!-- Contrat du script de page : js/contrats.js lit ce <select>. Les chips
           écrivent dedans puis déclenchent le rendu. -->
      <select id="ctFilterType" hidden aria-hidden="true" tabindex="-1">
        <option value="">Tous les types</option>
        <option value="cdi">CDI</option>
        <option value="cdd">CDD</option>
        <option value="vacation">Vacation</option>
        <option value="stage">Stage</option>
        <option value="alternance">Alternance</option>
      </select>
    </div>

    <!-- Tableau des contrats -->
    <div id="ct2Table" class="ct2-tablecard"></div>

    <!-- Échéances contractuelles + répartition -->
    <div class="ct2-g2">
      <div id="ct2Echeances" class="ct2-tint"></div>
      <div id="ct2Repartition" class="v2-blk"></div>
    </div>

    <!-- Génération de documents -->
    <div id="ct2Gen" class="v2-blk ct2-mt"></div>

    <!-- Alertes de renouvellement + périodes d'essai -->
    <div class="ct2-g2">
      <div id="ct2Alertes" class="ct2-tint"></div>
      <div id="ct2Essais" class="v2-blk"></div>
    </div>

    <!-- Ancienneté + historique + DPAE -->
    <div class="ct2-g3">
      <div id="ct2Anciennete" class="v2-blk"></div>
      <div id="ct2Histo" class="v2-blk"></div>
      <div id="ct2Dpae" class="v2-blk"></div>
    </div>

    <!-- Coût employeur par contrat (encadrement uniquement) -->
    <div id="ct2Cout" class="ct2-tablecard ct2-mt"></div>

    <!-- Avenants + registre unique du personnel -->
    <div class="ct2-g12">
      <div id="ct2Avenants" class="v2-blk"></div>
      <div id="ct2Registre" class="ct2-tint" style="--ta:rgba(34,211,238,.12);--tb:rgba(129,140,248,.05);--tc:rgba(34,211,238,.22)"></div>
    </div>

    <!-- Conteneurs hérités conservés : d'anciens appels peuvent encore les viser -->
    <div hidden aria-hidden="true">
      <div id="ctStats"></div><div id="ctAlerts"></div><div id="ctList"></div>
    </div>

  </div>
</div>

<!-- ── Modale « contrat » (gabarit .v2-ov / .v2-md) ─────────────────────── -->
<div class="v2-ov" id="modalContrat">
  <div class="v2-md" style="--mc:#10b981" role="dialog" aria-modal="true" aria-label="Contrat de travail">
    <div class="v2-md-h">
      <span class="v2-md-ico" id="cmxBadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
      <div style="min-width:0">
        <div class="v2-md-t" id="ctModalTitle">Nouveau contrat</div>
        <div class="v2-md-s" id="cmxSub">Renseignez les informations du contrat</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalContrat')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="v2-md-b">
      <div>
        <label class="v2-fld-l" for="ctEmploye">Salarié *</label>
        <select id="ctEmploye" class="v2-fld" onchange="cmxSyncType()"></select>
      </div>

      <div>
        <label class="v2-fld-l">Type de contrat *</label>
        <div class="v2-seg" id="ctTypeSeg"></div>
        <!-- Contrat du script de page : js/contrats.js lit et écrit ce <select>. -->
        <select id="ctType" hidden aria-hidden="true" tabindex="-1" onchange="cmxSyncType()">
          <option value="cdi">CDI</option>
          <option value="cdd">CDD</option>
          <option value="vacation">Vacation</option>
          <option value="stage">Stage</option>
          <option value="alternance">Alternance</option>
        </select>
      </div>

      <div>
        <label class="v2-fld-l" for="ctPoste">Poste</label>
        <select id="ctPoste" class="v2-fld"><option value="">— Sélectionner un poste —</option></select>
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="ctDebut">Date de début *</label>
          <input type="date" id="ctDebut" class="v2-fld"/>
        </div>
        <div id="ctFinWrap">
          <label class="v2-fld-l" for="ctFin">Date de fin</label>
          <input type="date" id="ctFin" class="v2-fld"/>
        </div>
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="ctTemps">Temps de travail</label>
          <select id="ctTemps" class="v2-fld" onchange="cmxSyncType()">
            <option value="plein">Temps plein</option>
            <option value="partiel">Temps partiel</option>
          </select>
        </div>
        <div>
          <label class="v2-fld-l" for="ctHeures">Heures / semaine</label>
          <input type="number" id="ctHeures" class="v2-fld" min="0" max="48" step="0.5" placeholder="35" oninput="cmxSyncType()"/>
        </div>
      </div>

      <div id="ctEssaiWrap">
        <label class="v2-fld-l" for="ctEssai">Fin de période d'essai</label>
        <input type="date" id="ctEssai" class="v2-fld"/>
        <div class="ct2-hint">Une alerte reste affichée jusqu'à la date saisie.</div>
      </div>

      <div>
        <label class="v2-fld-l" for="ctFichier">Contrat signé / document (PDF ou image) — optionnel</label>
        <input type="file" id="ctFichier" class="v2-fld" accept="image/*,application/pdf"/>
        <div id="ctFichierInfo" class="ct2-file"></div>
      </div>

      <div>
        <label class="v2-fld-l" for="ctNotes">Notes</label>
        <textarea id="ctNotes" class="v2-fld" rows="2" placeholder="Particularités, clauses…"></textarea>
      </div>

      <div id="ctAvenantsSection" style="display:none">
        <label class="v2-fld-l">Avenants</label>
        <div id="ctAvenantsList"></div>
        <div class="ct2-av-add">
          <input type="text" id="ctAvenantTxt" class="v2-fld" placeholder="Ex : passage à 28h/semaine au 01/09/2026"/>
          <button type="button" class="v2-btn-sec" style="flex:0 0 auto;padding:0 14px" onclick="addAvenant()">+ Avenant</button>
        </div>
      </div>
    </div>

    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" id="ctDeleteBtn" style="display:none;color:var(--v2-danger-text)" onclick="deleteContrat()">Supprimer</button>
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalContrat')">Annuler</button>
      <button type="button" class="v2-btn-pri" onclick="saveContrat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<!-- ── Modale « détail du contrat » ─────────────────────────────────────── -->
<div class="v2-ov" id="modalContratDoc">
  <div class="v2-md" style="--mc:#22d3ee" role="dialog" aria-modal="true" aria-label="Détail du contrat">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
      <div style="min-width:0">
        <div class="v2-md-t">Détail du contrat</div>
        <div class="v2-md-s">Fiche de synthèse</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalContratDoc')" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="v2-md-b" id="ctDocBody"></div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalContratDoc')">Fermer</button>
      <button type="button" class="v2-btn-pri" id="ctDocEditBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        Modifier
      </button>
    </div>
  </div>
</div>

<!-- Modale des blocs RH (génération de documents, coût employeur, DPAE) —
     contenu rendu par js/contrats-v2.js, même gabarit V2. -->
<div class="v2-ov" id="ct2Modal"></div>

<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/audit-supabase.js"></script>
<script src="js/search-global.js"></script>
<script src="js/notif-bell.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/employes-supabase.js"></script>
<script src="js/absences-supabase.js"></script>
<script src="js/contrats-supabase.js"></script>
<script src="js/contrats.js"></script>
<script src="js/contrats-v2.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
