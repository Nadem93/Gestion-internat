<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><link rel="manifest" href="manifest.json"/><meta name="theme-color" content="#0a1728"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Répertoire — FTR</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/v2.css"/>
  <link rel="stylesheet" href="css/v2-clair.css"/>
  <link rel="stylesheet" href="css/v2-clair-pages.css"/>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/v2-repertoire.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="v2">
<div class="v2-shell" style="--v2-halo:rgba(124,58,237,.2)">

  <div class="v2-top">
    <a class="v2-logo" href="accueil.html" style="background:linear-gradient(135deg,#7c3aed,#a78bfa)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <div style="line-height:1.15;min-width:0">
      <div class="v2-eyebrow">INTERNALIS · Dossiers &amp; suivi</div>
      <div class="v2-top-title">Répertoire des partenaires</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <label class="rp-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchRepertoire" placeholder="Organisme, nom, fonction…" oninput="renderContacts()" aria-label="Rechercher un contact"/>
      </label>
      <button type="button" class="v2-btn v2-btn-primary" onclick="openAddContact()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nouveau contact
      </button>
    </div>
  </div>

  <div class="v2-body">

    <!-- Filtres par catégorie -->
    <div class="rp-filters">
      <div id="repChips" class="v2-chips"></div>
      <span id="contactCount" class="rp-count"></span>
    </div>

    <!-- Grille des contacts -->
    <div id="contactList"></div>

    <!-- Favoris + derniers appels -->
    <div class="rp-bottom">
      <div class="rp-fav-blk">
        <div class="rp-blk-h">
          <svg viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="v2-blk-t">Contacts favoris</span>
        </div>
        <div id="repFavoris"></div>
      </div>
      <div class="v2-blk">
        <div class="rp-blk-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span class="v2-blk-t">Derniers appels</span>
        </div>
        <div id="repAppels"></div>
      </div>
    </div>

  </div>
</div>

<!-- MODALE CONTACT -->
<div class="v2-ov" id="modalContact">
  <div class="v2-md" style="--mc:#a78bfa">
    <div class="v2-md-h">
      <span class="v2-md-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
      <div style="min-width:0">
        <div class="v2-md-t" id="modalContactTitle">Nouveau contact</div>
        <div class="v2-md-s">Répertoire partenaires</div>
      </div>
      <button type="button" class="v2-md-x" onclick="closeModal('modalContact')" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="v2-md-b">
      <input type="hidden" id="contactId"/>
      <input type="hidden" id="cCategorie"/>

      <div class="v2-note v2-note-warn" id="contactReadonlyHint" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Contact ajouté par un autre membre — lecture seule. Seul son auteur ou un administrateur peut le modifier.
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="cOrganisme">Organisme / Partenaire</label>
          <input type="text" class="v2-fld" id="cOrganisme" placeholder="Nom de l'organisme"/>
        </div>
        <div>
          <label class="v2-fld-l" for="cNom">Nom du contact</label>
          <input type="text" class="v2-fld" id="cNom" placeholder="Prénom et nom"/>
        </div>
      </div>

      <div>
        <span class="v2-fld-l">Catégorie</span>
        <div class="rp-seg-wrap" id="cCatSeg"></div>
      </div>

      <div class="v2-grid2">
        <div>
          <label class="v2-fld-l" for="cTel">Téléphone</label>
          <input type="tel" class="v2-fld" id="cTel" placeholder="01 40 00 00 00"/>
        </div>
        <div>
          <label class="v2-fld-l" for="cEmail">E-mail</label>
          <input type="email" class="v2-fld" id="cEmail" placeholder="contact@exemple.fr"/>
        </div>
      </div>

      <div>
        <label class="v2-fld-l" for="cFonction">Fonction / Service</label>
        <input type="text" class="v2-fld" id="cFonction" placeholder="Ex : Assistante sociale, Médecin…"/>
      </div>
      <div>
        <label class="v2-fld-l" for="cAdresse">Adresse</label>
        <textarea class="v2-fld" id="cAdresse" rows="2" placeholder="Adresse complète"></textarea>
      </div>
      <div>
        <label class="v2-fld-l" for="cNotes">Notes</label>
        <textarea class="v2-fld" id="cNotes" rows="2" placeholder="Informations complémentaires"></textarea>
      </div>

      <label class="rp-fav-toggle">
        <input type="checkbox" id="cFavori"/>
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Contact favori — épinglé en bas de page pour un accès immédiat
      </label>
    </div>
    <div class="v2-md-f">
      <button type="button" class="v2-btn-sec" id="btnDeleteContact" style="display:none;color:var(--v2-danger-text)" onclick="deleteContact()">Supprimer</button>
      <button type="button" class="v2-btn-sec" onclick="closeModal('modalContact')">Annuler</button>
      <button type="button" class="v2-btn-pri" id="btnSaveContact" onclick="saveContact()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        Enregistrer le contact
      </button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/app.js"></script>
<script>Auth.requireAuth();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/offline-outbox.js"></script>
<script src="js/search-global.js"></script>
<script src="js/residents-supabase.js"></script>
<script src="js/repertoire-supabase.js"></script>
<script src="js/repertoire.js?v=2"></script>
<script src="js/repertoire-v2.js?v=2"></script>
</body>
</html>
